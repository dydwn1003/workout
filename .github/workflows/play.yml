# Builds the Google Play upload file (Android App Bundle, .aab) and
# publishes it as the "android-store" GitHub release:
#   https://github.com/<owner>/<repo>/releases/download/android-store/alasfit.aab
# Upload that file in Play Console (testing track or production).
# Run with "커뮤니티 켜기" checked for the 1.1 community build (version 1.1.0,
# release "android-store-community").
#
# Run it from the Actions tab ("Build Play Store bundle" → Run workflow), or
# push a tag like v1.0.0. Needs the upload key secrets
# (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD): Play only accepts bundles signed with the
# registered upload key, so there is no test-key fallback here.
#
# versionName comes from pubspec.yaml (bump it for each store release);
# versionCode is the commit count, so it only grows and matches the test
# APKs from android.yml.
name: Build Play Store bundle

on:
  workflow_dispatch:
    inputs:
      community:
        description: '커뮤니티 켜기 (1.1 테스트용, 버전 1.1.0 · release android-store-community)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: play
  cancel-in-progress: true

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit count = versionCode
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Upload key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Pasted values often carry a trailing newline or spaces: trim them
          # (a newline in a value breaks $GITHUB_ENV).
          trim() { printf '%s' "$1" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | head -n1; }
          STORE_PW=$(trim "$STORE_PW")
          KEY_ALIAS=$(trim "$KEY_ALIAS")
          KEY_PW=$(trim "$KEY_PW")
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing (see the comment at the top of play.yml)"
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore" || {
            echo "::error::ANDROID_KEYSTORE_BASE64 is not valid base64: paste the whole keystore_base64.txt"
            exit 1
          }
          keytool -list -keystore "$RUNNER_TEMP/release.keystore" -storepass "$STORE_PW" -alias "$KEY_ALIAS" > /dev/null || {
            echo "::error::Keystore check failed: ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS doesn't match the keystore"
            exit 1
          }
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PW"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PW"
          } >> "$GITHUB_ENV"

      - name: Build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
          COMMUNITY: ${{ inputs.community && 'true' || 'false' }}
        run: |
          if [ -z "$GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::warning::GOOGLE_WEB_CLIENT_ID variable is empty: Google sign-in won't work in this build"
          fi
          case "$GOOGLE_WEB_CLIENT_ID" in
            *,*|*" "*)
              echo "::error::GOOGLE_WEB_CLIENT_ID must be ONE client id (the Web application one), not a list"
              exit 1 ;;
          esac
          CODE=$(git rev-list --count HEAD)
          NAME=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          EXTRA=()
          TAG=android-store
          # 커뮤니티 버전 (1.1): its own version name and release.
          if [ "$COMMUNITY" = "true" ]; then
            NAME=1.1.0
            EXTRA=(--dart-define=COMMUNITY=true)
            TAG=android-store-community
          fi
          flutter build appbundle --release \
            --build-number="$CODE" \
            --build-name="$NAME" \
            "${EXTRA[@]}" \
            --dart-define=STORE_LISTED=true \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID"
          cp build/app/outputs/bundle/release/app-release.aab alasfit.aab
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete "$RELEASE_TAG" --yes --cleanup-tag || true
          gh release create "$RELEASE_TAG" alasfit.aab \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "알아서핏 Play 스토어 업로드용 $VERSION_NAME ($VERSION_CODE)" \
            --notes "Play Console에 올리는 파일이에요. 버전 $VERSION_NAME, 버전 코드 $VERSION_CODE, commit $GITHUB_SHA."
