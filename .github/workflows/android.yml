# Builds the Android app (APK) and publishes it as the "android-latest"
# GitHub release, so a phone can download it directly:
#   https://github.com/<owner>/<repo>/releases/download/android-latest/alasfit.apk
#
# Signing: with the repository secrets ANDROID_KEYSTORE_BASE64 (the .jks /
# .keystore file, base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD set, the APK is signed with that key (use this for
# the Play Store). Without them a test key is made on the first run and kept
# in the Actions cache, so later APKs install over earlier ones; if the
# cache expires (7 days without builds) the next APK needs a reinstall.
name: Build Android APK

on:
  push:
    branches: [claude/cool-gates-llcuky]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get

      - name: Test key (no signing secrets)
        if: env.HAS_SIGNING_KEY != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.android-test-key
          key: android-test-key-v1
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PW"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PW"
            } >> "$GITHUB_ENV"
          else
            mkdir -p ~/.android-test-key
            if [ ! -f ~/.android-test-key/test.keystore ]; then
              keytool -genkeypair -keystore ~/.android-test-key/test.keystore \
                -storepass alasfit-test -keypass alasfit-test -alias test \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=AlasFit Test, O=AlasFit, C=KR"
            fi
            {
              echo "ANDROID_KEYSTORE_PATH=$HOME/.android-test-key/test.keystore"
              echo "ANDROID_KEYSTORE_PASSWORD=alasfit-test"
              echo "ANDROID_KEY_ALIAS=test"
              echo "ANDROID_KEY_PASSWORD=alasfit-test"
            } >> "$GITHUB_ENV"
          fi

      - name: Build
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"
          cp build/app/outputs/flutter-apk/app-release.apk alasfit.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest alasfit.apk \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "알아서핏 Android (최신 테스트 빌드)" \
            --notes "Commit $GITHUB_SHA, build ${{ github.run_number }}. 폰에서 alasfit.apk를 받아 설치하세요 (출처를 알 수 없는 앱 설치 허용 필요)."
