# Checks the community for reports nobody has looked at yet and keeps one
# GitHub issue open while there are some, so GitHub emails the operator.
# The issue only has the count (the repo is public): the posts themselves
# are read in Supabase, see docs/community-ops.md.
#
# Secret: SUPABASE_SERVICE_ROLE_KEY (Supabase → Project Settings → API keys →
# secret / service_role). Variable: SUPABASE_URL (already set for the app).
name: Community reports

on:
  schedule:
    - cron: '17 */3 * * *' # every 3 hours
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: reports

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Count open reports
        id: count
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::warning::SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY is missing (see docs/community-ops.md)"
            echo "n=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AUTH=()
          # Legacy JWT keys also go as a bearer token; new sb_secret_ keys don't.
          case "$KEY" in sb_*) ;; *) AUTH=(-H "Authorization: Bearer $KEY") ;; esac
          CODE=$(curl -sS -o body.txt -w '%{http_code}' -X POST "${URL%/}/rest/v1/rpc/community_open_reports" \
            -H "apikey: $KEY" "${AUTH[@]}" -H 'Content-Type: application/json' -d '{}')
          if [ "$CODE" = 404 ]; then
            # The function comes with supabase/community.sql; until that SQL
            # is run there is nothing to check (and no reason to fail).
            echo "::warning::community_open_reports not found: run supabase/community.sql (see docs/community-ops.md)"
            echo "n=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$CODE" != 200 ]; then
            echo "::error::Supabase answered $CODE"
            cat body.txt
            exit 1
          fi
          N=$(cat body.txt)
          echo "open reports: $N"
          echo "n=$N" >> "$GITHUB_OUTPUT"

      - name: Keep the reminder issue up to date
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          N: ${{ steps.count.outputs.n }}
        run: |
          TITLE="커뮤니티 신고 ${N}건 확인 필요"
          OPEN=$(gh issue list --label community-report --state open --json number --jq '.[0].number // empty' || true)
          if [ "${N:-0}" -gt 0 ]; then
            BODY=$(printf '@%s 처리하지 않은 신고가 %s건 있어요. 24시간 안에 확인해 주세요.\n\nSupabase → SQL Editor에서 `select * from report_queue;` 로 보고, docs/community-ops.md 순서대로 처리하면 이 이슈는 다음 확인 때 자동으로 닫혀요.' "$OWNER" "$N")
            if [ -n "$OPEN" ]; then
              gh issue edit "$OPEN" --title "$TITLE" --body "$BODY"
            else
              gh label create community-report --color E0614F --force >/dev/null
              gh issue create --title "$TITLE" --body "$BODY" --label community-report
            fi
          elif [ -n "$OPEN" ]; then
            gh issue close "$OPEN" --comment "남은 신고가 없어서 닫아요."
          fi
