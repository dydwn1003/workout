<!doctype html>
<html lang="ko">
<head>

<title>Adapt Coach</title>
<style>
@font-face { font-family: "NSR"; font-weight: 700; src: url(data:font/woff2;base64,/*FONT_B*/) format("woff2"); }
@font-face { font-family: "NSR"; font-weight: 800; src: url(data:font/woff2;base64,/*FONT_EB*/) format("woff2"); }
:root {

  --breakfast: #E8770E; --breakfast-soft: #FFEAD4; --lunch: #B38600; --lunch-soft: #FFF4C7;

.list > * + * { border-top: 1px solid var(--line); }

.tabs { display: flex; border-bottom: 1px solid var(--line); margin: 8px -20px 16px; padding: 0 12px; }

  padding: 12px 18px; border-radius: 14px; z-index: 30; opacity: 0; transition: opacity .3s var(--ease), transform .45s var(--spring); pointer-events: none; max-width: calc(100% - 32px); }

.setrow { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
.sico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.sico svg { width: 20px; height: 20px; }
select.input { padding: 8px 12px; width: auto; border-radius: 12px; font-size: 14px; }
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; border: 0; cursor: pointer; transition: background-color .3s var(--ease); flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .45s var(--spring); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.switch.on { background: var(--peach); }
.switch.on::after { transform: translateX(20px); }
summary::-webkit-details-marker { display: none; }
.note { font-size: 12.5px; color: var(--soft); line-height: 1.55; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<body>
<div id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
// ============================================================================
// Coach engine (JS port of lib/core/coach_engine — keep the two in sync)
// ============================================================================
const C = {
  kcalPerKg: 7700, alpha: 0.1, windowDays: 14, minWindowDays: 10, maxWindowDays: 21, minLoggedDayKcal: 800,
  maxObs: 0.85, fullObsDays: 28, maxWeeklyChange: 150, floor: { male: 1500, female: 1200 },
  maxLoss: 1.0, maxGain: 0.5, minAge: 18, minBmi: 18.5,
  rates: { lose: { relaxed: .25, normal: .5, fast: .75 }, gain: { relaxed: .1, normal: .25, fast: .4 }, recomp: { relaxed: .1, normal: .2, fast: .3 } },
  protein: { lossLbm: 2.2, maintLbm: 1.8, lossBw: 1.8, maintBw: 1.6 }, fatMinKg: .6, fatMinPct: .25,
  minLogged: 5, minWeigh: 3, highLogged: 6, highWeigh: 5, plateauDays: 14, plateauMax: .15,
  muscleWarn: .01, etaSlope: 28, etaMinSlope: 21, etaSpread: .2,
};
const activity = n => n <= 1 ? 1.2 : n <= 3 ? 1.375 : n <= 5 ? 1.55 : 1.725;
function trendSeries(ws) { let t = null; return ws.map(w => { if (w != null) t = t == null ? w : t + C.alpha * (w - t); return t; }); }
const lastNN = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; };
const lbm = (kg, bf) => kg * (1 - bf / 100);
const bmrMifflin = (sex, kg, cm, age) => 10 * kg + 6.25 * cm - 5 * age + (sex === "male" ? 5 : -161);
function formulaTdee(p, kg, sessions, today, bf) {
  const bmr = bf != null ? 370 + 21.6 * lbm(kg, bf) : bmrMifflin(p.sex, kg, p.heightCm, today.getFullYear() - p.birthYear);
  return bmr * activity(sessions);
}
const isLogged = d => d.intake != null && d.intake >= C.minLoggedDayKcal;
function observedTdee(days, trend) {
  const n = days.length, span = n - 1;
  if (span < C.minWindowDays) return null;
  let w = Math.min(C.windowDays, span);
  const validIn = w => days.slice(n - w).filter(isLogged).length;
  if (validIn(w) < Math.ceil(w * 0.7) && span >= C.maxWindowDays) w = C.maxWindowDays;
  const valid = days.slice(n - w).filter(isLogged);
  if (valid.length < C.minLogged) return null;
  const st = trend[n - 1 - w], en = trend[n - 1];
  if (st == null || en == null) return null;
  const avg = valid.reduce((a, d) => a + d.intake, 0) / valid.length;
  const delta = en - st, imb = delta * C.kcalPerKg / w;
  return { avgIntake: avg, trendChange: delta, imbalance: imb, tdee: avg - imb, validDays: valid.length, windowDays: w };
}
const obsWeight = n => Math.min(C.maxObs, n / C.fullObsDays);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function ratePct(type, pace) {
  if (type === "maintain") return 0;
  const r = C.rates[type][pace];
  return Math.min(r, type === "gain" ? C.maxGain : C.maxLoss);
}
const plannedKgPerWeek = (type, pace, kg) => ratePct(type, pace) / 100 * kg * (type === "gain" ? 1 : -1);
function targetKcal(tdee, type, pace, kg, sex) {
  const raw = tdee + plannedKgPerWeek(type, pace, kg) * C.kcalPerKg / 7;
  const floor = C.floor[sex];
  return raw < floor ? { kcal: floor, floorHit: true } : { kcal: raw, floorHit: false };
}
function macrosFor(kcal, kg, type, bf) {
  const losing = type === "lose" || type === "recomp";
  const protein = bf != null ? lbm(kg, bf) * (losing ? C.protein.lossLbm : C.protein.maintLbm) : kg * (losing ? C.protein.lossBw : C.protein.maintBw);
  const fat = Math.max(C.fatMinKg * kg, kcal * C.fatMinPct / 9);
  const carbs = Math.max(0, (kcal - protein * 4 - fat * 9) / 4);
  return { kcal, p: protein, c: carbs, f: fat };
}
function confidenceFor(logged, weighs) {
  if (logged < C.minLogged || weighs < C.minWeigh) return "low";
  if (logged >= C.highLogged && weighs >= C.highWeigh) return "high";
  return "medium";
}
const targetFromBf = (kg, cur, tgt) => lbm(kg, cur) / (1 - tgt / 100);
const bmi = (kg, cm) => kg / Math.pow(cm / 100, 2);
function validateGoal(p, kg, g, today) {
  const out = [];
  if (today.getFullYear() - p.birthYear < C.minAge) out.push("underage");
  const losing = g.type === "lose" || g.type === "recomp";
  if (losing && bmi(kg, p.heightCm) < C.minBmi) out.push("bmiLow");
  const t = g.targetKg;
  if (t != null) {
    if (losing && bmi(t, p.heightCm) < C.minBmi) out.push("targetBmiLow");
    if ((g.type === "lose" && t >= kg) || (g.type === "gain" && t <= kg)) out.push("direction");
  }
  return out;
}
function etaWeeks(trend, targetKg, planned) {
  const last = lastNN(trend);
  if (last == null) return null;
  const remaining = targetKg - last;
  if (Math.abs(remaining) < 0.2) return [0, 0];
  let rate = null;
  const n = trend.length;
  if (n - 1 >= C.etaMinSlope) {
    const k = Math.min(C.etaSlope, n - 1), st = trend[n - 1 - k];
    if (st != null) {
      const obs = (last - st) / k * 7;
      if (Math.abs(obs) > 0.05 && Math.sign(obs) === Math.sign(remaining)) rate = obs;
    }
  }
  if (rate == null && planned !== 0 && Math.sign(planned) === Math.sign(remaining)) rate = planned;
  if (rate == null) return null;
  const w = remaining / rate;
  return [w * (1 - C.etaSpread), w * (1 + C.etaSpread)];
}
function muscleLossWarning(entries) {
  if (entries.length < 2) return false;
  const s = [...entries].sort((a, b) => a[0] - b[0]);
  const latest = s[s.length - 1];
  const cutoff = addDays(latest[0], -(28 - 7));
  const older = s.filter(e => e[0] <= cutoff);
  if (!older.length) return false;
  const target = addDays(latest[0], -28);
  older.sort((a, b) => Math.abs(a[0] - target) - Math.abs(b[0] - target));
  const base = older[0][1];
  return (base - latest[1]) / base > C.muscleWarn;
}
function initialPlan(p, g, kg, today, bf) {
  const tdee = formulaTdee(p, kg, g.sessions, today, bf);
  const t = targetKcal(tdee, g.type, g.pace, kg, p.sex);
  return { tdee, macros: macrosFor(t.kcal, kg, g.type, bf), floorHit: t.floorHit };
}
function weeklyCheckin(p, g, days, today, prevTdee, bf) {
  const trend = trendSeries(days.map(d => d.weight));
  const trendNow = lastNN(trend);
  const kg = trendNow ?? 70;
  const formula = formulaTdee(p, kg, g.sessions, today, bf);
  const prev = prevTdee ?? formula;
  const lastWeek = days.length > 7 ? days.slice(days.length - 7) : days;
  const logged = lastWeek.filter(isLogged).length;
  const weighs = lastWeek.filter(d => d.weight != null).length;
  const confidence = confidenceFor(logged, weighs);
  const observed = observedTdee(days, trend);
  const totalValid = days.filter(isLogged).length;
  let tdee = prev, reason = "lowConfidence", adjusted = false;
  if (confidence !== "low" && trendNow != null) {
    const blended = observed == null ? formula : (1 - obsWeight(totalValid)) * formula + obsWeight(totalValid) * observed.tdee;
    tdee = clamp(blended, prev - C.maxWeeklyChange, prev + C.maxWeeklyChange);
    adjusted = true;
    const losing = g.type === "lose" || g.type === "recomp";
    const n = trend.length;
    const flat = n - 1 >= C.plateauDays && trend[n - 1 - C.plateauDays] != null && Math.abs(trendNow - trend[n - 1 - C.plateauDays]) < C.plateauMax;
    if (losing && flat && confidence === "high" && tdee < prev - 25) reason = "plateau";
    else if (tdee > prev + 25) reason = "tdeeUp";
    else if (tdee < prev - 25) reason = "tdeeDown";
    else reason = "onTrack";
  }
  const t = targetKcal(tdee, g.type, g.pace, kg, p.sex);
  return { avgIntake: observed?.avgIntake ?? null, trendChange: observed?.trendChange ?? null, formula, observed, prev, tdee,
    proposal: macrosFor(t.kcal, kg, g.type, bf), confidence, reason, floorHit: t.floorHit, adjusted, trendNow, logged, weighs };
}

// ============================================================================
// Offline text meal estimator (same table as lib/data/food_estimator.dart)
// ============================================================================
// Food table generated from data/foods_ko.tsv (per 100 g, approximate reference values).
const FOODS_DB = /*FOODS_JSON*/[];
const BUILTIN = FOODS_DB.map(r => ({ id: r[0], name: r[1], aliases: r[2], cat: r[3], kcal: r[4], p: r[5], c: r[6], f: r[7], units: r[8].map(([label, g]) => ({ label, g })), unknown: r[9] || "" }));

function chartSvg(pts, goal) {
  const W = 340, H = 240, L = 34, B = 22, T = 8, R = 8;
  const vals = pts.flatMap(p => [p.raw, p.trend]).filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const showGoal = goal != null && goal > lo - 8 && goal < hi + 8;
  if (showGoal) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  lo = Math.floor(lo - .5); hi = Math.ceil(hi + .5); if (hi - lo < 2) hi = lo + 2;
  const cw = W - L - R, ch = H - B - T, n = pts.length;
  const x = i => L + cw * i / (n - 1), y = v => T + ch - ch * (v - lo) / (hi - lo);
  const stepv = Math.max(1, Math.ceil((hi - lo) / 4));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="체중 추세 그래프">`;
  for (let v = lo; v <= hi + .001; v += stepv) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => s += `<text x="${x(i)}" y="${H - 4}" text-anchor="${["start", "middle", "end"][k]}">${fmtMd(pts[i].date)}</text>`);
  if (showGoal) s += `<line x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--mint)" stroke-width="2" stroke-dasharray="5 5"/>`;
  pts.forEach((p, i) => { if (p.raw != null) s += `<circle class="pt" style="animation-delay:${Math.round(i / n * 500)}ms" cx="${x(i)}" cy="${y(p.raw)}" r="${n > 60 ? 2.4 : 3.4}" fill="var(--sky)" fill-opacity=".45"/>`; });
  const tp = pts.map((p, i) => p.trend == null ? null : [x(i), y(p.trend)]).filter(Boolean);
  if (tp.length > 1) {
    const d = "M" + tp.map(p => p.map(v => v.toFixed(1)).join(",")).join("L");
    s += `<defs><linearGradient id="fillg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF8E7F" stop-opacity=".2"/><stop offset="1" stop-color="#FF8E7F" stop-opacity="0"/></linearGradient></defs>
      <path d="${d}L${tp[tp.length - 1][0]},${T + ch}L${tp[0][0]},${T + ch}Z" fill="url(#fillg)"/>
      <path class="trend" d="${d}" stroke="var(--peach)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${tp[tp.length - 1][0]}" cy="${tp[tp.length - 1][1]}" r="6" fill="#fff" class="pt" style="animation-delay:1s"/><circle cx="${tp[tp.length - 1][0]}" cy="${tp[tp.length - 1][1]}" r="4.5" fill="var(--peach)" class="pt" style="animation-delay:1s"/>`;
  }
  return s + "</svg>";
}

      <div class="card" style="padding:16px"><div class="muted small">지난 7일</div><div class="h num" style="font-size:24px;color:var(--sky)">${ch == null ? "—" : s1(ch) + "kg"}</div></div></div>
    ${goal != null ? `<div ${st()}><div class="card row" style="padding:16px">${ic("flag", 22, "var(--mint)")}<b class="h num">목표 체중 ${f1(goal)}kg</b><span style="margin-left:auto">${pill(etaText(eta()), "var(--mint)", "var(--mint-soft)")}</span></div></div>` : ""}
    <h2 class="h sect" style="margin-bottom:0">운동 추이</h2>
    <div ${st()}>${(() => {
      const wk = workoutWeeks(), last = wk[wk.length - 1], avg = wk.slice(-4).reduce((a, w) => a + w.strength + w.cardio, 0) / 4, planned = S.profile.strength + S.profile.cardio;
      if (!wk.some(w => w.strength + w.cardio)) return `<div class="card"><p class="muted" style="margin:0">운동을 기록하면 주별 추이를 볼 수 있어요</p></div>`;
      return `<div class="card" style="padding:16px 18px 14px"><div class="grid2" style="margin-bottom:12px">
        <div><div class="muted small">최근 7일</div><div class="h num" style="font-size:19px;color:var(--mint)">${last.strength + last.cardio}회 · ${last.minutes}분</div></div>
        <div><div class="muted small">4주 평균</div><div class="h num" style="font-size:19px;color:var(--sky)">주 ${avg.toFixed(1)}회</div></div></div>
        <div class="col" style="gap:8px;margin-bottom:14px">${workoutTips().slice(0, 4).map(tipRow).join("")}</div>
        ${workoutBars(wk, planned)}
        <div class="row small muted" style="justify-content:center;gap:14px;margin-top:8px;flex-wrap:wrap"><span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:var(--mint)"></i>근력운동</span>
          <span class="row" style="gap:5px"><i style="width:10px;height:10px;border-radius:3px;background:var(--sky)"></i>유산소</span>
          <span class="row" style="gap:5px"><i style="width:16px;height:3px;border-radius:2px;background:var(--peach)"></i>설정 횟수</span></div></div>`;
    })()}</div>
    <h2 class="h sect" style="margin-bottom:0">체성분 추이</h2>
    ${muscleWarn() ? `<div class="row" style="align-items:flex-end">${mascot(48, "thinking")}<div class="bubble">최근 4주간 골격근량이 측정 오차보다 크게 줄었어요. 감량 속도를 낮추고 단백질 섭취를 확인해 보세요.</div></div>` : ""}
    <div ${st()}><div class="card" style="padding:10px 20px">${comp.length ? `<table style="width:100%;border-collapse:collapse" class="num"><thead><tr class="muted small"><th></th><th style="text-align:right;font-weight:700;padding:6px 0">체지방률</th><th style="text-align:right;font-weight:700">골격근량</th></tr></thead><tbody>
      ${comp.map(w => `<tr><td style="padding:6px 0">${pd(w.date).getMonth() + 1}월 ${pd(w.date).getDate()}일</td><td class="h" style="text-align:right">${w.bf == null ? "—" : f1(w.bf) + "%"}</td><td class="h" style="text-align:right">${w.smm == null ? "—" : f1(w.smm) + "kg"}</td></tr>`).join("")}</tbody></table>`
      : `<p class="muted" style="margin:6px 0">체성분을 입력하면 여기서 추이를 볼 수 있어요.</p>`}</div></div>
    <h2 class="h sect" style="margin-bottom:0">체중 기록</h2>
    <div ${st()}><div class="card list" style="padding:4px 0">${S.weights.slice().reverse().slice(0, 10).map(w => `<div class="row" style="padding:8px 8px 8px 20px">
      <span style="flex:1">${fmtDate(pd(w.date))}</span><b class="h num">${f1(w.kg)} kg</b><button class="iconbtn" data-act="delWeight" data-v="${w.date}" aria-label="삭제">${ic("x", 16, "var(--soft)")}</button></div>`).join("")}</div></div></div>`;
}

const REASON = {
  lowConfidence: r => `이번 주는 기록이 조금 부족해요 (식사 ${r.logged}/7일, 체중 ${r.weighs}회). 목표는 그대로 둘게요. 식사 5일, 체중 3회 이상이면 조정할 수 있어요.`,
  plateau: r => `체중 추세가 2주째 거의 그대로예요. 계산해 보니 소비량이 약 ${f0(r.tdee)} kcal로 낮아진 것 같아요. 목표를 살짝 낮춰볼까요?`,
  tdeeUp: r => `생각보다 에너지를 더 쓰고 있어요! 추정 소비량을 ${f0(r.tdee)} kcal로 올렸어요.`,
  tdeeDown: r => `추정 소비량이 ${f0(r.tdee)} kcal로 조금 내려갔어요. 목표를 그에 맞게 조정할게요.`,
  onTrack: () => "계획대로 잘 가고 있어요! 목표는 거의 그대로예요.",
};
const MOOD = { lowConfidence: "sleepy", plateau: "thinking", tdeeUp: "cheer", onTrack: "cheer", tdeeDown: "happy" };
const CONF = { high: ["높음", "var(--mint)", "var(--mint-soft)"], medium: ["보통", "var(--butter-ink)", "var(--butter-soft)"], low: ["낮음", "var(--soft)", "var(--line)"] };
const STATUS = { initial: "시작", accepted: "수락", kept: "유지", manual: "직접" };
const summary = (p, key) => `<div class="row" style="text-align:center;gap:0">${[["하루 목표", p.kcal, "var(--peach)", ""], ["단백질", p.p, "var(--mint)", "g"], ["탄수화물", p.c, "var(--butter-ink)", "g"], ["지방", p.f, "var(--lilac)", "g"]]
  .map(([l, v, c, u]) => `<div style="flex:1"><div class="h" style="font-size:12px;color:${c}">${l}</div><div class="h num" style="font-size:18px">${f0(v)}${u}</div></div>`).join("")}</div>`;
function viewCheckin() {
  stg = 0;
  const plan = currentPlan(), due = checkinDue(), doneToday = plan.status !== "initial" && plan.weekStart === dk(today());
  const r = runCheckin(), next = nextCheckin();
  let html = `<h1 class="h title" style="margin-bottom:12px">주간 체크인</h1>`;
  if (!due && next) html += `<div style="margin:0 0 12px 2px">${pill("다음 체크인: " + fmtDate(next), "var(--peach)", "var(--peach-soft)")}</div>`;
  html += `<div class="col" style="gap:14px">`;
  const sug = workoutSuggestion();
  if (sug) html += `<div ${st()}><div class="card" style="background:var(--mint-soft);box-shadow:none;padding:16px 18px 10px">
    <div class="row" style="gap:8px">${ic("dumbbell", 22, "var(--mint)")}<b class="h" style="font-size:16px">운동 횟수를 맞춰볼까요?</b></div>
    <p style="margin:8px 0 0;line-height:1.55;font-size:14px">지난 2주 동안 주 평균 근력 ${sug[0]}회 · 유산소 ${sug[1]}회 운동했어요. 설정은 주 ${S.profile.strength + S.profile.cardio}회예요. 실제 기록에 맞추면 공식 추정치가 더 정확해져요.</p>
    <div style="text-align:right"><button class="btn txt" data-act="applySug" style="color:var(--mint)">기록에 맞추기</button></div></div></div>`;
  if (doneToday && !ui.forcePreview) {
    html += `<div ${st()}><div class="card" style="text-align:center">${mascot(80, "cheer")}<h2 class="h" style="font-size:19px;margin:10px 0 6px">이번 주 체크인 완료!</h2>
      <p class="muted" style="margin:0 0 16px;line-height:1.55">다음 체크인까지 꾸준히 기록해 주세요. 기록이 많을수록 정확해져요.</p>${summary(plan)}
      <button class="btn txt" data-act="forcePreview" style="margin-top:10px">그래도 지금 다시 계산해 보기</button></div></div>`;
  } else if (r) {
    const [cl, cc, cs] = CONF[r.confidence], diff = r.proposal.kcal - plan.kcal, win = r.observed ? `최근 ${r.observed.windowDays}일` : "";
    if (!due) html += `<p class="note" style="margin:0 4px">아직 체크인 날은 아니지만 미리 볼 수 있어요</p>`;
    const tile = (l, v, sub) => `<div class="card" style="padding:14px"><div class="muted small">${l}</div><div class="h num" style="font-size:20px;margin-top:4px">${v}</div>${sub ? `<div class="muted" style="font-size:11.5px">${sub}</div>` : ""}</div>`;
    html += `<div ${st()}><div class="row" style="align-items:flex-end">${mascot(64, MOOD[r.reason])}<div class="bubble">${REASON[r.reason](r)}</div></div></div>
      <div class="grid2" ${st()}>${tile("평균 섭취", r.avgIntake == null ? "—" : f0(r.avgIntake) + " kcal", win)}${tile("추세 체중 변화", r.trendChange == null ? "—" : s1(r.trendChange) + " kg", win)}
        ${tile("추정 소비량", count("ci-tdee", r.tdee, "kcal"))}<div class="card" style="padding:14px"><div class="muted small">신뢰도</div><div style="margin-top:6px">${pill(cl, cc, cs, "check")}</div></div></div>
      <div ${st()}><div class="card"><div class="row" style="text-align:center"><div style="flex:1"><div class="muted" style="font-size:13px">현재 목표</div><div class="h num muted" style="font-size:26px">${f0(plan.kcal)}</div></div>
        ${ic("right", 24, "var(--peach)")}<div style="flex:1"><div style="font-size:13px;color:var(--peach)">새 목표 제안</div><div class="h" style="font-size:34px">${count("ci-new", r.proposal.kcal)}</div></div></div>
        <div style="text-align:center;margin:6px 0 14px">${pill((diff >= 0 ? "+" : "") + f0(diff) + " kcal", Math.abs(diff) < 1 ? "var(--soft)" : "var(--peach)", Math.abs(diff) < 1 ? "var(--line)" : "var(--peach-soft)")}</div>
        <div style="border-top:1px solid var(--line);padding-top:12px">${summary(r.proposal)}</div></div></div>
      ${r.floorHit ? `<p class="note" style="color:var(--peach);margin:0 4px">안전 하한 때문에 ${f0(r.proposal.kcal)} kcal 아래로는 내리지 않았어요. 속도를 낮추는 걸 고려해 보세요.</p>` : ""}
      <div class="col" style="gap:10px" ${st()}>${r.adjusted ? `<button class="btn pri" data-act="ciAccept">수락</button>` : ""}
        <div class="row"><button class="btn ${r.adjusted ? "out" : "pri"}" data-act="ciKeep">유지</button><button class="btn out" data-act="ciManual">직접 조정</button></div></div>
      <details class="card" style="padding:16px 20px" ${st()}><summary class="h row" style="cursor:pointer;list-style:none;gap:10px">${ic("calc", 22, "var(--lilac)")}어떻게 계산했나요?</summary>
        <p style="line-height:1.65;margin:12px 0 0;font-size:14px">${r.observed ? `최근 ${r.observed.windowDays}일 동안 평균 ${f0(r.observed.avgIntake)} kcal를 먹었고 추세 체중이 ${s1(r.observed.trendChange)}kg 변했어요. 1kg ≈ 7,700 kcal로 환산하면 실제 소비량은 약 ${f0(r.observed.tdee)} kcal예요. 이를 공식 추정치(${f0(r.formula)} kcal)와 섞고, 한 주 변화폭을 ±150 kcal로 제한해서 ${f0(r.tdee)} kcal로 정했어요.`
          : `아직 실측 데이터가 부족해서 공식 추정치(${f0(r.formula)} kcal)를 기준으로 해요. 2주 정도 꾸준히 기록하면 실제 소비량을 계산할 수 있어요.`}</p></details>`;
  }
  html += `<h2 class="h sect" style="margin-bottom:0">목표 변화 기록</h2><div ${st()}><div class="card list" style="padding:4px 0">${S.plans.slice().reverse().slice(0, 12).map(p => `<div class="row" style="padding:10px 20px">
    <span style="flex:1"><div>${pd(p.weekStart).getMonth() + 1}월 ${pd(p.weekStart).getDate()}일</div><div class="muted" style="font-size:12px">추정 소비량 ${f0(p.tdee)} kcal</div></span>
    ${pill(STATUS[p.status], "var(--soft)", "var(--line)")}<b class="h num" style="min-width:86px;text-align:right">${f0(p.kcal)} kcal</b></div>`).join("")}</div></div></div>`;
  return html;
}

function viewSettings() {
  stg = 0;
  const p = S.profile, age = today().getFullYear() - p.birthYear;
  const row = (icon, c, sf, title, sub, right, act) => `<div class="setrow ${act ? "tap" : ""}" ${act ? `data-act="${act}" role="button" tabindex="0"` : ""}>
    <span class="sico" style="background:${sf}">${ic(icon, 20, c)}</span><span style="flex:1"><div>${title}</div>${sub ? `<div class="muted small">${sub}</div>` : ""}</span>${right || ""}</div>`;
  const group = (t, rows) => `<h2 class="h sect">${t}</h2><div ${st()}><div class="card list" style="padding:4px 0">${rows.join("")}</div></div>`;
  return `<h1 class="h title">설정</h1>` +
    group("내 정보", [`<div class="setrow">${mascot(40)}<span style="flex:1"><b class="h" style="font-size:17px">${GOAL_LABEL[p.goalType]}</b><div class="muted small">${p.sex === "male" ? "남성" : "여성"} · ${age}세 · ${f0(p.heightCm)}cm</div></span>
        ${p.targetKg != null ? pill(f1(p.targetKg) + "kg", "var(--mint)", "var(--mint-soft)") : ""}</div>`,
      row("flag", "var(--peach)", "var(--peach-soft)", "목표 다시 설정", "기록은 그대로 두고 목표만 바꿔요", ic("right", 20, "var(--soft)"), "editGoal"),
      row("bookmark", "var(--lilac)", "var(--lilac-soft)", "내 식사 관리", "", `<b class="h">${S.saved.length}</b>`, "manageSaved")]) +
    group("앱", [row("cal", "var(--peach)", "var(--peach-soft)", "체크인 요일", "", `<select class="input" id="wd" data-act="weekday">${[1, 2, 3, 4, 5, 6, 7].map(d => `<option value="${d}" ${S.settings.checkinWeekday === d ? "selected" : ""}>${WD[d % 7]}요일</option>`).join("")}</select>`),
      row("bell", "var(--butter-ink)", "var(--butter-soft)", "체크인 알림", "모바일 앱에서 지원 예정", `<button class="switch ${S.settings.notifications ? "on" : ""}" data-act="notif" aria-label="체크인 알림"></button>`),
      row("scale", "var(--mint)", "var(--mint-soft)", "단위", "", `<b class="h small">kg · kcal</b>`)]) +
    group("데이터", [row("flask", "var(--lilac)", "var(--lilac-soft)", "샘플 데이터 채우기", "5주치 예시 기록으로 체크인과 그래프를 체험해요", "", "demoConfirm"),
      S.settings.consentedAt ? row("check", "var(--mint)", "var(--mint-soft)", `민감정보 저장 동의일: ${new Date(S.settings.consentedAt).toLocaleDateString("ko-KR")}`, "", "") : "",
      `<div class="setrow tap" data-act="deleteConfirm" role="button" tabindex="0"><span class="sico" style="background:#FFE4E4">${ic("trash", 20, "#E5484D")}</span><span style="color:#E5484D">모든 데이터 삭제</span></div>`]) +
    group("정보", [row("book", "var(--mint)", "var(--mint-soft)", "출처: 식품의약품안전처 식품영양성분 데이터베이스", "음식 검색의 영양정보는 공공데이터포털에서 받은 데이터를 100g 기준으로 바꾼 값이에요.", ""),
      `<p class="note" style="padding:14px 18px;margin:0">이 앱은 의학적 조언을 제공하지 않아요. 질환이 있거나 임신·수유 중이라면 먼저 전문가와 상담해 주세요.<br>미리보기 버전 · 기록은 이 브라우저에만 저장돼요.</p>`]);
}

// Every month since the start: check = logged, X = missed, ring = today not yet.
function logCalendarBody() {

  let done = 0; for (let d = start; +d <= +t; d = addDays(d, 1)) if (days.has(dk(d))) done++;

  const mark = (kind, size) => { const [bg, bd, fg, txt] = { done: ["var(--peach)", "var(--peach)", "#fff", "✓"], missed: ["var(--bg)", "var(--line)", "var(--soft)", "✕"], today: ["#fff", "var(--peach)", "", ""], none: ["transparent", "transparent", "", ""] }[kind];
    return `<i style="width:${size}px;height:${size}px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:${size * .5}px;font-weight:800;background:${bg};border:${kind === "today" ? 2 : 1.5}px solid ${bd};color:${fg}">${txt}</i>`; };
  let html = `<h2 class="h" style="font-size:22px;margin:0 0 12px">기록 달력</h2>
    <div class="row" style="gap:6px;flex-wrap:wrap">${pill(`${done}/${total}일 기록`, "var(--peach)", "var(--peach-soft)")}${pill(`지금 ${streak()}일 연속`, "var(--peach)", "var(--peach-soft)")}${pill(`최장 ${longestStreak()}일 연속`, "var(--mint)", "var(--mint-soft)")}${pill(`놓친 날 ${missed}일`, "var(--soft)", "var(--line)")}</div>
    <p class="note" style="margin:10px 0">식사·체중·운동 중 하나라도 기록한 날은 체크, 기록이 없던 날은 X로 표시돼요. 날짜를 누르면 그날로 이동해요.</p>
    <div class="row" style="gap:14px;margin-bottom:6px">${[["done", "기록함"], ["missed", "놓침"], ["today", "오늘"]].map(([k, l]) => `<span class="row small muted" style="gap:5px">${mark(k, 18)}${l}</span>`).join("")}</div>`;
  for (let m = new Date(t.getFullYear(), t.getMonth(), 1); +m >= +new Date(start.getFullYear(), start.getMonth(), 1); m = new Date(m.getFullYear(), m.getMonth() - 1, 1)) {
    const n = new Date(m.getFullYear(), m.getMonth() + 1, 0).getDate(), cells = [];
    for (let i = 0; i < m.getDay(); i++) cells.push("<span></span>");
    for (let i = 1; i <= n; i++) {
      const d = new Date(m.getFullYear(), m.getMonth(), i), inRange = +d >= +start && +d <= +t, isToday = +d === +t;
      const kind = !inRange ? "none" : days.has(dk(d)) ? "done" : isToday ? "today" : "missed";
      cells.push(`<button class="tap" ${inRange ? `data-act="logDay" data-v="${dk(d)}"` : "disabled"} style="border:0;background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:${inRange ? "pointer" : "default"}">
        <span class="small" style="font-size:11px;${isToday ? "color:var(--peach);font-weight:800" : inRange ? "" : "color:var(--line)"}">${i}</span>${mark(kind, 26)}</button>`);
    }
    html += `<div class="card" style="padding:14px 12px 10px;margin-top:14px"><b class="h" style="margin-left:6px">${m.getFullYear()}년 ${m.getMonth() + 1}월</b>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);margin-top:8px;text-align:center">${WD.map(w => `<span class="small muted">${w}</span>`).join("")}${cells.join("")}</div></div>`;
  }

}
function dialog(html) {
  const d = document.createElement("div"); d.className = "dialog"; d.innerHTML = `<div class="overlay open" data-act="closeDialog"></div><div class="box" role="dialog" aria-modal="true">${html}</div>`;
  document.body.appendChild(d); return d;
}
const closeDialog = () => document.querySelectorAll(".dialog").forEach(d => d.remove());
function confirmDialog(msg, okLabel, act, danger) {
  dialog(`<p style="line-height:1.6;margin:0 0 18px">${msg}</p><div class="row" style="justify-content:flex-end;gap:4px"><button class="btn txt" data-act="closeDialog" style="color:var(--soft)">취소</button>
    <button class="btn txt" data-act="${act}" ${danger ? 'style="color:#E5484D"' : ""}>${okLabel}</button></div>`);
}

// ============================================================================
// Render & events
// ============================================================================
let lastView = "";
function render() {
  const app = $("#app");
  const viewKey = ui.ob ? "ob" + ui.ob.step : ui.tab + (ui.date ? dk(ui.date) : "");
  animate = viewKey !== lastView;
  lastView = viewKey;
  if (ui.ob || !S.profile || !S.plans.length) {
    if (!ui.ob) ui.ob = newOb(false);
    app.innerHTML = viewOnboarding();
  } else {
    const v = { today: viewToday, trend: viewTrend, checkin: viewCheckin, settings: viewSettings }[ui.tab]();
    const due = checkinDue();
    const nav = [["today", "sun", "오늘"], ["trend", "chart", "트렌드"], ["checkin", "cal", "체크인"], ["settings", "tune", "설정"]];
    app.innerHTML = `<div class="page ${animate ? "view" : ""}" id="view">${v}</div><nav class="nav" aria-label="메뉴"><div class="in">${nav.map(([k, icn, l]) => `<button class="${ui.tab === k ? "on" : ""}" data-act="tab" data-v="${k}" ${ui.tab === k ? 'aria-current="page"' : ""}>
      <span class="pil">${ic(icn)}</span>${l}${k === "checkin" && due ? '<span class="dot"></span>' : ""}</button>`).join("")}</div></nav>`;
  }
  ui.dir = "";
  afterRender();
}
const val = id => $("#" + id)?.value ?? "";
const readMeal = () => ({ name: val("mName").trim(), kcal: num(val("mKcal")) || 0, p: num(val("mP")) || 0, c: num(val("mC")) || 0, f: num(val("mF")) || 0 });

const actions = {
  consent: el => { ui.ob.consent = el.checked; $("#obNext").disabled = !obCanNext(ui.ob); $("#obDemo").disabled = !ui.ob.consent; },
  obNext: () => {
    const o = ui.ob, steps = obSteps(o);
    if (steps[o.step] === "result") { const edit = o.editing; obFinish(); if (edit) ui.tab = "settings"; }
    else { o.step++; ui.dir = "fwd"; }
    render(); scrollTo(0, 0);
  },
  obBack: () => { const o = ui.ob; if (o.step === 0) { if (o.editing) { ui.ob = null; ui.tab = "settings"; } } else { o.step--; ui.dir = "back"; } render(); },
  obGoal: el => { ui.ob.goal = el.dataset.v; render(); },
  obSex: el => { ui.ob.sex = el.dataset.v; render(); },
  obByBf: el => { ui.ob.byBf = el.dataset.v === "1"; render(); },
  obPace: el => { ui.ob.pace = el.dataset.v; render(); },
  obStep: el => { const k = el.dataset.k; ui.ob[k] = clamp(ui.ob[k] + +el.dataset.d, 0, 14); render(); },
  demo: () => { loadDemo(); ui.ob = null; ui.tab = "today"; ui.date = null; render(); toast("샘플 데이터를 채웠어요. 체크인 탭을 확인해 보세요!"); },
  tab: el => { if (ui.tab === el.dataset.v) return; ui.tab = el.dataset.v; ui.forcePreview = false; render(); scrollTo(0, 0); },
  goCheckin: () => { ui.tab = "checkin"; render(); scrollTo(0, 0); },
  dayPrev: () => { ui.date = addDays(ui.date || today(), -1); ui.dir = "back"; render(); },
  dayNext: () => { const n = addDays(ui.date, 1); ui.date = +n >= +today() ? null : n; ui.dir = "fwd"; render(); },
  dayToday: () => { ui.date = null; ui.dir = "fwd"; render(); },
  logCalendar: () => openSheet("logcal"),
  logDay: el => { const d = pd(el.dataset.v), cur = ui.date || today(); closeSheet(); ui.dir = +d < +cur ? "back" : "fwd"; ui.date = +d === +today() ? null : d; render(); },
  addMeal: () => openSheet("meal", { tab: "search", view: "list", q: "", cat: null, slot: slotForTime(new Date()), added: 0, text: "" }),
  addMealSlot: el => openSheet("meal", { tab: "search", view: "list", q: "", cat: null, slot: el.dataset.v, added: 0, text: "" }),
  mealTab: el => { sheet.tab = el.dataset.v; if (sheet.tab === "search") sheet.view = "list"; renderSheet(); },
  mealSlot: el => { sheet.slot = el.dataset.v; renderSheet(); if (sheet.tab === "search" && sheet.view === "detail") updateDetail(); },
  estimate: () => { sheet.text = val("mText"); if (!sheet.text.trim()) return; sheet.est = estimateText(sheet.text, allFoods()); renderSheet(); },
  foodCat: el => { sheet.cat = el.dataset.v || null; renderResults(); },
  foodOpen: el => { sheet.food = foodById(el.dataset.id); sheet.unitIdx = 0; sheet.qty = 1; sheet.view = "detail"; sheet.anim = "fwd"; renderSheet(); updateDetail(); },
  foodQuick: (el, ev) => { ev.stopPropagation(); const f = foodById(el.dataset.id); logFood(f, f.units[0], 1); renderSheet(); },
  foodBack: () => { sheet.view = "list"; sheet.anim = "back"; renderSheet(); },
  foodUnit: el => {
    const units = allUnits(sheet.food), old = units[sheet.unitIdx], nu = units[+el.dataset.i], grams = old.g * sheet.qty;
    sheet.unitIdx = +el.dataset.i;
    sheet.qty = nu.label === "g" ? Math.round(grams) : Math.max(0.5, Math.round(grams / nu.g * 2) / 2);
    renderSheet(); updateDetail(true);
  },
  foodQty: el => { const u = allUnits(sheet.food)[sheet.unitIdx], step = u.label === "g" ? 10 : 0.5;
    sheet.qty = clamp(Math.round((sheet.qty + step * +el.dataset.v) * 10) / 10, step, u.label === "g" ? 5000 : 50); $("#fdQty").value = fmtQty(sheet.qty); updateDetail(true); },
  foodAdd: () => { if (!(sheet.qty > 0)) { toast("수량을 입력해 주세요"); return; } logFood(sheet.food, allUnits(sheet.food)[sheet.unitIdx], sheet.qty); sheet.view = "list"; sheet.anim = "back"; renderSheet(); },
  foodNew: () => { sheet.view = "create"; sheet.anim = "fwd"; renderSheet(); },
  foodCreate: () => {
    const name = val("cfName").trim(), unitLabel = val("cfUnit").trim() || "1인분", kcal = num(val("cfK"));
    if (!name || !(kcal > 0)) { toast("이름과 칼로리를 입력해 주세요"); return; }
    const g = num(val("cfGrams"));
    const c = { id: "c" + uid(), name, unitLabel, grams: g > 0 ? g : null, kcal, p: num(val("cfP")) || 0, c: num(val("cfC")) || 0, f: num(val("cfF")) || 0 };
    S.customFoods.push(c); save(); toast(`'${name}'을(를) 내 음식에 저장했어요`);
    sheet.food = customToFood(c); sheet.unitIdx = 0; sheet.qty = 1; sheet.view = "detail"; sheet.anim = "fwd"; renderSheet(); updateDetail();
  },
  mealAdd: () => {
    const m = readMeal(); if (!m.name || m.kcal <= 0) { toast("이름과 칼로리를 입력해 주세요"); return; }
    addMeal({ ...m, source: sheet.tab === "text" ? "text" : "manual", slot: sheet.slot }, ui.date);
    if ($("#mSave")?.checked) { S.saved = S.saved.filter(s => s.name !== m.name); S.saved.push({ id: uid(), ...m }); save(); }
    closeSheet(); render(); toast(`${m.name} 추가!`);
  },
  quickAdd: el => { const d = el.dataset; addMeal({ name: d.name, kcal: +d.k, p: +d.p, c: +d.c, f: +d.f, source: "saved", slot: sheet.slot }, ui.date);
    sheet.added = (sheet.added || 0) + 1; render(); renderSheet(); toast(`${d.name} → ${slotName(sheet.slot)}`); },
  delSaved: (el, ev) => { ev.stopPropagation(); S.saved = S.saved.filter(s => s.id !== el.dataset.id); save(); renderSheet(); if (ui.tab === "settings") render(); },
  editMeal: el => openSheet("edit", { meal: { ...S.meals.find(m => m.id === el.dataset.id) } }),
  mealSave: () => { const m = readMeal(); if (!m.name || m.kcal <= 0) { toast("이름과 칼로리를 입력해 주세요"); return; }
    const i = S.meals.findIndex(x => x.id === sheet.meal.id), old = S.meals[i];
    const changed = m.name !== old.name || ["kcal", "p", "c", "f"].some(k => Math.round(m[k]) !== Math.round(old[k]));
    S.meals[i] = { ...old, ...m, slot: sheet.meal.slot, edited: old.edited || changed, portion: changed ? null : old.portion }; save(); closeSheet(); render(); toast("수정했어요"); },
  editSlot: el => { sheet.meal.slot = el.dataset.v; document.querySelectorAll("[data-act=editSlot]").forEach(b => b.classList.toggle("on", b.dataset.v === sheet.meal.slot)); },
  mealDelete: () => { S.meals = S.meals.filter(x => x.id !== sheet.meal.id); save(); closeSheet(); render(); toast("삭제했어요"); },
  weight: () => openSheet("weight", {}),
  workout: el => openSheet("workout", { type: el.dataset.v, minutes: el.dataset.v === "strength" ? 60 : 30 }),
  woType: el => { sheet.type = el.dataset.v; renderSheet(); },
  woMin: el => { sheet.minutes = clamp(sheet.minutes + +el.dataset.v, 1, 600); const i = $("#woMin"); i.value = sheet.minutes;
    i.animate([{ transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 300, easing: "cubic-bezier(.34,1.56,.64,1)" }); syncPresets(); },
  woPreset: el => { sheet.minutes = +el.dataset.v; $("#woMin").value = sheet.minutes; syncPresets(); },
  woSave: () => { if (!(sheet.minutes >= 1)) { toast("운동 시간을 입력해 주세요"); return; } const w = { id: uid(), date: dk(ui.date || today()), type: sheet.type, minutes: sheet.minutes }; S.workouts.push(w); save();
    closeSheet(); render(); toast(`${w.type === "strength" ? "근력운동" : "유산소"} ${w.minutes}분 기록!`); },
  delWorkout: (el, ev) => { ev.stopPropagation(); S.workouts = S.workouts.filter(w => w.id !== el.dataset.id); save(); render(); toast("운동 기록을 지웠어요"); },
  applySug: () => { const sg = workoutSuggestion(); if (!sg) return; S.profile.strength = sg[0]; S.profile.cardio = sg[1]; save(); render(); toast("운동 횟수를 업데이트했어요"); },
  bump: el => { sheet.kg = clamp(Math.round((sheet.kg + +el.dataset.v) * 10) / 10, 25, 300); const k = $("#kgv"); k.textContent = f1(sheet.kg); k.animate([{ transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 300, easing: "cubic-bezier(.34,1.56,.64,1)" }); },
  showComp: () => { sheet.comp = true; renderSheet(); },
  weightSave: () => {
    const bf = num(val("wBf")), smm = num(val("wSmm"));
    upsertWeight({ date: dk(ui.date || today()), kg: sheet.kg, bf: bf > 2 && bf < 70 ? bf : null, smm: smm > 5 && smm < 100 ? smm : null });
    closeSheet(); render(); toast("체중을 기록했어요");
  },
  delWeight: el => { S.weights = S.weights.filter(w => w.date !== el.dataset.v); save(); render(); },
  range: el => { ui.trendRange = +el.dataset.v; render(); },
  forcePreview: () => { ui.forcePreview = true; render(); },
  ciAccept: () => { applyCheckin(runCheckin(), "accepted"); ui.forcePreview = false; render(); toast("새 목표를 적용했어요!"); },
  ciKeep: () => { applyCheckin(runCheckin(), "kept"); ui.forcePreview = false; render(); toast("기존 목표를 유지해요"); },
  ciManual: () => {
    const floor = C.floor[S.profile.sex], r = runCheckin();
    dialog(`<h3 class="h" style="margin:0 0 14px;font-size:20px">목표 칼로리 직접 입력</h3><input class="input num" id="manKcal" inputmode="numeric" value="${Math.round(r.proposal.kcal)}">
      <p class="note" id="manNote" style="margin:8px 4px 16px">최소 ${f0(floor)} kcal 이상이어야 해요</p>
      <div class="row" style="justify-content:flex-end;gap:4px"><button class="btn txt" data-act="closeDialog" style="color:var(--soft)">취소</button><button class="btn txt" data-act="manOk">확인</button></div>`);
    setTimeout(() => $("#manKcal")?.focus(), 50);
  },
  manOk: () => { const v = num(val("manKcal")), floor = C.floor[S.profile.sex];
    if (v == null || v < floor || v >= 8000) { const n = $("#manNote"); n.style.color = "var(--over)"; n.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], { duration: 250 }); return; }
    closeDialog(); applyCheckin(runCheckin(), "manual", v); ui.forcePreview = false; render(); toast("직접 정한 목표를 적용했어요"); },
  closeDialog: () => closeDialog(),
  closeSheet: () => closeSheet(),
  editGoal: () => { ui.ob = newOb(true); ui.dir = "fwd"; render(); scrollTo(0, 0); },
  manageSaved: () => openSheet("manageSaved"),
  notif: () => { S.settings.notifications = !S.settings.notifications; save(); $("[data-act=notif]").classList.toggle("on", S.settings.notifications); },
  demoConfirm: () => confirmDialog("지금 기록이 샘플 데이터로 바뀌어요. 계속할까요?", "확인", "demoYes"),
  demoYes: () => { closeDialog(); actions.demo(); },
  deleteConfirm: () => confirmDialog("체중, 식사, 목표 기록이 모두 지워지고 처음 화면으로 돌아가요. 되돌릴 수 없어요.", "삭제", "deleteYes", true),
  deleteYes: () => { closeDialog(); S = empty(); save(); ui.ob = null; ui.tab = "today"; ui.date = null; render(); },
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = actions[el.dataset.act]; if (!a || el.tagName === "SELECT") return;
  if (el.type === "checkbox") return;
  a(el, ev);
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.act === "pickDate") {
    if (!el.value) return;
    const d = pd(el.value), cur = ui.date || today();
    if (+d > +today()) return;
    ui.dir = +d < +cur ? "back" : "fwd"; ui.date = +d === +today() ? null : d; render(); return;
  }
  if (el.dataset.act === "consent") actions.consent(el);
  if (el.dataset.act === "weekday") { S.settings.checkinWeekday = +el.value; save(); }
});
const syncPresets = () => document.querySelectorAll("[data-act=woPreset]").forEach(b => b.classList.toggle("on", +b.dataset.v === sheet.minutes));
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.id === "fq" && sheet) { sheet.q = el.value; renderResults(); }
  if (el.id === "fdQty" && sheet) { sheet.qty = parseFloat(el.value) || 0; updateDetail(); }
  if (el.id === "woMin" && sheet) { el.value = el.value.replace(/\D/g, "").slice(0, 3); sheet.minutes = Math.min(600, parseInt(el.value, 10) || 0); syncPresets(); }
  if (el.dataset.ob && ui.ob) {
    ui.ob[el.dataset.ob] = el.value;
    $("#obNext").disabled = !obCanNext(ui.ob);
    if (el.dataset.ob === "targetBf") { const tw = obTarget(ui.ob), r = $("#bfResult");
      r.innerHTML = tw != null ? `<div class="card h" style="background:var(--lilac-soft);box-shadow:none;padding:16px">근육(제지방량)을 유지하면 목표 체중은 약 ${f1(tw)}kg이에요</div>` : ""; }
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { closeDialog(); closeSheet(); }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[role=button]")) { ev.preventDefault(); ev.target.click(); }
});
render();
</script>
