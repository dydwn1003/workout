<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adapt Coach</title>
<style>
@font-face { font-family: "NSR"; font-weight: 400; src: url(data:font/woff2;base64,/*FONT_R*/) format("woff2"); }
@font-face { font-family: "NSR"; font-weight: 800; src: url(data:font/woff2;base64,/*FONT_EB*/) format("woff2"); }
:root {
  --bg: #FFF8F1; --card: #FFFFFF; --ink: #3B3340; --soft: #8A8190; --line: #F1E6DC;
  --peach: #FF8E7F; --peach-soft: #FFE3DC; --mint: #4CC9A4; --mint-soft: #D9F5EC;
  --butter: #FFC34D; --butter-ink: #D49B1F; --butter-soft: #FFF0CC;
  --lilac: #A38BFF; --lilac-soft: #ECE6FF; --sky: #6EB7FF; --sky-soft: #E0F0FF; --over: #FF6B6B;
  --shadow: 0 8px 24px rgba(185,139,110,.09);
  --ease: cubic-bezier(.22,1,.36,1);
  --spring: cubic-bezier(.34,1.56,.64,1);
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 15px/1.5 "NSR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  letter-spacing: -0.1px;
}
button, input, textarea, select { font: inherit; color: inherit; }
.h { font-weight: 800; letter-spacing: -0.4px; }
.num { font-variant-numeric: tabular-nums; }
#app { max-width: 480px; margin: 0 auto; min-height: 100%; position: relative; }
.page { padding: 16px 16px 120px; }
.view { animation: fadeUp .5s var(--ease) both; }
.stg { animation: fadeUp .55s var(--ease) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes slideL { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }
@keyframes slideR { from { opacity: 0; transform: translateX(-22px); } to { opacity: 1; transform: none; } }
@keyframes float { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-4px) rotate(1.5deg); } }
@keyframes pop { 0% { transform: scale(.6); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.fwd { animation: slideL .45s var(--ease) both; }
.back { animation: slideR .45s var(--ease) both; }
.mascot { display: inline-block; animation: float 2.6s ease-in-out infinite; }
.card { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); padding: 20px; }
.tap { cursor: pointer; transition: transform .45s var(--spring), background-color .3s var(--ease), border-color .3s var(--ease), box-shadow .3s var(--ease); }
.tap:active { transform: scale(.965); transition-duration: .09s; }
.row { display: flex; align-items: center; gap: 10px; }
.col { display: flex; flex-direction: column; gap: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.muted { color: var(--soft); }
.small { font-size: 12.5px; }
.title { font-size: 25px; margin: 0; }
.sect { font-size: 19px; margin: 18px 4px 10px; }
.btn { border: 0; border-radius: 18px; min-height: 54px; padding: 0 20px; font-weight: 800; font-size: 17px; cursor: pointer; width: 100%;
  transition: transform .45s var(--spring), background-color .3s var(--ease), opacity .3s var(--ease); }
.btn:active:not(:disabled) { transform: scale(.965); transition-duration: .09s; }

.btn.txt { background: none; color: var(--peach); min-height: 40px; width: auto; }
.btn.txt:disabled { color: #CFC4C0; }
.btn:focus-visible, .tap:focus-visible, input:focus-visible { outline: 3px solid var(--peach-soft); outline-offset: 2px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 20px; padding: 4px 10px; font-weight: 800; font-size: 13px; white-space: nowrap; }
.field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }

.input { width: 100%; border: 1.5px solid var(--line); border-radius: 16px; background: #fff; padding: 14px 16px; font-size: 16px; outline: none; transition: border-color .25s var(--ease), box-shadow .25s var(--ease); }
.input:focus { border-color: var(--peach); box-shadow: 0 0 0 4px var(--peach-soft); }

.seg button:disabled { color: #CFC4C0; cursor: default; }
.choice { display: flex; align-items: center; gap: 14px; padding: 16px; border-radius: 22px; background: #fff; border: 1.5px solid var(--line); width: 100%; text-align: left; }
.choice.on { border-width: 2px; }
.ico { width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; flex: none; }

.check { margin-left: auto; opacity: 0; transform: scale(.6); transition: opacity .25s var(--ease), transform .45s var(--spring); }
.on .check { opacity: 1; transform: none; }
.progress { display: flex; gap: 6px; flex: 1; }
.progress i { flex: 1; height: 8px; border-radius: 8px; background: var(--line); transition: background-color .45s var(--ease); }
.progress i.on { background: var(--peach); }
.iconbtn { border: 0; background: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; color: var(--ink); transition: background-color .2s; }
.iconbtn:hover { background: rgba(0,0,0,.04); }

.stepper { display: flex; align-items: center; gap: 4px; }

.bar { height: 10px; border-radius: 8px; overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 8px; width: 0; transition: width .9s var(--ease); }
.ring circle { transition: stroke-dashoffset 1s var(--ease), stroke .4s var(--ease); }
.nav { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; box-shadow: 0 -4px 20px rgba(185,139,110,.08);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 5; }
.nav .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(4,1fr); }
.nav button { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 800; font-size: 12.5px; color: var(--soft); cursor: pointer; padding: 4px 0; position: relative; }
.nav .pil { width: 64px; height: 32px; border-radius: 16px; display: grid; place-items: center; transition: background-color .35s var(--ease); }
.nav button.on { color: var(--ink); }
.nav button.on .pil { background: var(--peach-soft); color: var(--peach); }

.fab { position: fixed; right: max(16px, calc(50% - 224px)); bottom: calc(88px + env(safe-area-inset-bottom, 0px)); z-index: 4; border: 0; border-radius: 20px;
  background: var(--peach); color: #fff; font-weight: 800; font-size: 16px; padding: 16px 22px; box-shadow: 0 10px 24px rgba(255,142,127,.4); cursor: pointer;
  display: flex; align-items: center; gap: 8px; transition: transform .45s var(--spring); animation: pop .5s var(--spring) .2s both; }
.fab:active { transform: scale(.94); transition-duration: .09s; }
.list > * + * { border-top: 1px solid var(--line); }
.mealrow { display: flex; align-items: center; gap: 12px; padding: 12px 20px; cursor: pointer; transition: background-color .2s; }
.mealrow:hover { background: #FFFBF7; }
.avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--peach-soft); color: var(--peach); display: grid; place-items: center; flex: none; }
.avatar svg { width: 20px; height: 20px; }
.ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.overlay { position: fixed; inset: 0; background: rgba(59,51,64,.38); z-index: 10; opacity: 0; transition: opacity .35s var(--ease); }
.overlay.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; max-width: 480px; margin: 0 auto; background: var(--bg); border-radius: 28px 28px 0 0;
  max-height: 90%; display: flex; flex-direction: column; transform: translateY(100%); transition: transform .42s var(--ease); }
.sheet.open { transform: none; }
.sheet .grab { width: 40px; height: 5px; border-radius: 4px; background: #5a4d52; opacity: .7; margin: 12px auto 8px; }
.sheet .body { overflow: auto; padding: 4px 20px calc(24px + env(safe-area-inset-bottom, 0px)); }
.tabs { display: flex; border-bottom: 1px solid var(--line); margin: 8px -20px 16px; padding: 0 12px; }
.tabs button { flex: 1; border: 0; background: none; padding: 12px 4px; font-weight: 800; color: var(--soft); cursor: pointer; position: relative; }
.tabs button.on { color: var(--ink); }
.tabs button.on::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: -1px; height: 3px; border-radius: 3px; background: var(--peach); animation: pop .35s var(--ease); }
.dialog { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; }
.dialog .box { background: var(--bg); border-radius: 24px; padding: 22px; width: 100%; max-width: 360px; animation: pop .35s var(--spring); }
.toast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: #fff;
  padding: 12px 18px; border-radius: 14px; z-index: 30; opacity: 0; transition: opacity .3s var(--ease), transform .45s var(--spring); pointer-events: none; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.bubble { background: #fff; border-radius: 20px 20px 20px 6px; padding: 12px 16px; box-shadow: 0 6px 16px rgba(185,139,110,.07); flex: 1; line-height: 1.5; }
.daydot { display: flex; flex-direction: column; align-items: center; gap: 4px; flex: 1; }
.daydot i { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 11px; background: var(--bg); animation: pop .45s var(--spring) both; }
.daydot i.part { background: var(--peach-soft); color: var(--peach); }
.daydot i.full { background: var(--peach); color: #fff; }
.daydot i.today { border: 2px solid var(--peach); }
.chips { display: flex; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: #fff; border-radius: 14px; padding: 8px 16px; font-weight: 800; cursor: pointer; transition: background-color .3s var(--ease); }
.chip.on { background: var(--peach-soft); }
.chart text { fill: var(--soft); font-size: 11px; font-family: inherit; }
.chart .trend { stroke-dasharray: var(--len); stroke-dashoffset: var(--len); animation: draw 1.2s var(--ease) .1s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.chart .pt { animation: pop .5s var(--spring) both; }
.setrow { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
.sico { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; }
.sico svg { width: 20px; height: 20px; }
select.input { padding: 8px 12px; width: auto; border-radius: 12px; font-size: 14px; }
.switch { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; border: 0; cursor: pointer; transition: background-color .3s var(--ease); flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .45s var(--spring); box-shadow: 0 2px 6px rgba(0,0,0,.12); }
.switch.on { background: var(--peach); }
.switch.on::after { transform: translateX(20px); }
summary::-webkit-details-marker { display: none; }
.note { font-size: 12.5px; color: var(--soft); line-height: 1.55; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

<body>
<div id="app"></div>
<div id="layer"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
// ============================================================================
// Coach engine (JS port of lib/core/coach_engine — keep the two in sync)
// ============================================================================
const C = {
  kcalPerKg: 7700, alpha: 0.1, windowDays: 14, minWindowDays: 10, maxWindowDays: 21, minLoggedDayKcal: 800,
  maxObs: 0.85, fullObsDays: 28, maxWeeklyChange: 150, floor: { male: 1500, female: 1200 },
  maxLoss: 1.0, maxGain: 0.5, minAge: 18, minBmi: 18.5,
  rates: { lose: { relaxed: .25, normal: .5, fast: .75 }, gain: { relaxed: .1, normal: .25, fast: .4 }, recomp: { relaxed: .1, normal: .2, fast: .3 } },
  protein: { lossLbm: 2.2, maintLbm: 1.8, lossBw: 1.8, maintBw: 1.6 }, fatMinKg: .6, fatMinPct: .25,
  minLogged: 5, minWeigh: 3, highLogged: 6, highWeigh: 5, plateauDays: 14, plateauMax: .15,
  muscleWarn: .01, etaSlope: 28, etaMinSlope: 21, etaSpread: .2,
};
const activity = n => n <= 1 ? 1.2 : n <= 3 ? 1.375 : n <= 5 ? 1.55 : 1.725;
function trendSeries(ws) { let t = null; return ws.map(w => { if (w != null) t = t == null ? w : t + C.alpha * (w - t); return t; }); }
const lastNN = a => { for (let i = a.length - 1; i >= 0; i--) if (a[i] != null) return a[i]; return null; };
const lbm = (kg, bf) => kg * (1 - bf / 100);
const bmrMifflin = (sex, kg, cm, age) => 10 * kg + 6.25 * cm - 5 * age + (sex === "male" ? 5 : -161);
function formulaTdee(p, kg, sessions, today, bf) {
  const bmr = bf != null ? 370 + 21.6 * lbm(kg, bf) : bmrMifflin(p.sex, kg, p.heightCm, today.getFullYear() - p.birthYear);
  return bmr * activity(sessions);
}
const isLogged = d => d.intake != null && d.intake >= C.minLoggedDayKcal;
function observedTdee(days, trend) {
  const n = days.length, span = n - 1;
  if (span < C.minWindowDays) return null;
  let w = Math.min(C.windowDays, span);
  const validIn = w => days.slice(n - w).filter(isLogged).length;
  if (validIn(w) < Math.ceil(w * 0.7) && span >= C.maxWindowDays) w = C.maxWindowDays;
  const valid = days.slice(n - w).filter(isLogged);
  if (valid.length < C.minLogged) return null;
  const st = trend[n - 1 - w], en = trend[n - 1];
  if (st == null || en == null) return null;
  const avg = valid.reduce((a, d) => a + d.intake, 0) / valid.length;
  const delta = en - st, imb = delta * C.kcalPerKg / w;
  return { avgIntake: avg, trendChange: delta, imbalance: imb, tdee: avg - imb, validDays: valid.length, windowDays: w };
}
const obsWeight = n => Math.min(C.maxObs, n / C.fullObsDays);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function ratePct(type, pace) {
  if (type === "maintain") return 0;
  const r = C.rates[type][pace];
  return Math.min(r, type === "gain" ? C.maxGain : C.maxLoss);
}
const plannedKgPerWeek = (type, pace, kg) => ratePct(type, pace) / 100 * kg * (type === "gain" ? 1 : -1);
function targetKcal(tdee, type, pace, kg, sex) {
  const raw = tdee + plannedKgPerWeek(type, pace, kg) * C.kcalPerKg / 7;
  const floor = C.floor[sex];
  return raw < floor ? { kcal: floor, floorHit: true } : { kcal: raw, floorHit: false };
}
function macrosFor(kcal, kg, type, bf) {
  const losing = type === "lose" || type === "recomp";
  const protein = bf != null ? lbm(kg, bf) * (losing ? C.protein.lossLbm : C.protein.maintLbm) : kg * (losing ? C.protein.lossBw : C.protein.maintBw);
  const fat = Math.max(C.fatMinKg * kg, kcal * C.fatMinPct / 9);
  const carbs = Math.max(0, (kcal - protein * 4 - fat * 9) / 4);
  return { kcal, p: protein, c: carbs, f: fat };
}
function confidenceFor(logged, weighs) {
  if (logged < C.minLogged || weighs < C.minWeigh) return "low";
  if (logged >= C.highLogged && weighs >= C.highWeigh) return "high";
  return "medium";
}
const targetFromBf = (kg, cur, tgt) => lbm(kg, cur) / (1 - tgt / 100);
const bmi = (kg, cm) => kg / Math.pow(cm / 100, 2);
function validateGoal(p, kg, g, today) {
  const out = [];
  if (today.getFullYear() - p.birthYear < C.minAge) out.push("underage");
  const losing = g.type === "lose" || g.type === "recomp";
  if (losing && bmi(kg, p.heightCm) < C.minBmi) out.push("bmiLow");
  const t = g.targetKg;
  if (t != null) {
    if (losing && bmi(t, p.heightCm) < C.minBmi) out.push("targetBmiLow");
    if ((g.type === "lose" && t >= kg) || (g.type === "gain" && t <= kg)) out.push("direction");
  }
  return out;
}
function etaWeeks(trend, targetKg, planned) {
  const last = lastNN(trend);
  if (last == null) return null;
  const remaining = targetKg - last;
  if (Math.abs(remaining) < 0.2) return [0, 0];
  let rate = null;
  const n = trend.length;
  if (n - 1 >= C.etaMinSlope) {
    const k = Math.min(C.etaSlope, n - 1), st = trend[n - 1 - k];
    if (st != null) {
      const obs = (last - st) / k * 7;
      if (Math.abs(obs) > 0.05 && Math.sign(obs) === Math.sign(remaining)) rate = obs;
    }
  }
  if (rate == null && planned !== 0 && Math.sign(planned) === Math.sign(remaining)) rate = planned;
  if (rate == null) return null;
  const w = remaining / rate;
  return [w * (1 - C.etaSpread), w * (1 + C.etaSpread)];
}
function muscleLossWarning(entries) {
  if (entries.length < 2) return false;
  const s = [...entries].sort((a, b) => a[0] - b[0]);
  const latest = s[s.length - 1];
  const cutoff = addDays(latest[0], -(28 - 7));
  const older = s.filter(e => e[0] <= cutoff);
  if (!older.length) return false;
  const target = addDays(latest[0], -28);
  older.sort((a, b) => Math.abs(a[0] - target) - Math.abs(b[0] - target));
  const base = older[0][1];
  return (base - latest[1]) / base > C.muscleWarn;
}
function initialPlan(p, g, kg, today, bf) {
  const tdee = formulaTdee(p, kg, g.sessions, today, bf);
  const t = targetKcal(tdee, g.type, g.pace, kg, p.sex);
  return { tdee, macros: macrosFor(t.kcal, kg, g.type, bf), floorHit: t.floorHit };
}
function weeklyCheckin(p, g, days, today, prevTdee, bf) {
  const trend = trendSeries(days.map(d => d.weight));
  const trendNow = lastNN(trend);
  const kg = trendNow ?? 70;
  const formula = formulaTdee(p, kg, g.sessions, today, bf);
  const prev = prevTdee ?? formula;
  const lastWeek = days.length > 7 ? days.slice(days.length - 7) : days;
  const logged = lastWeek.filter(isLogged).length;
  const weighs = lastWeek.filter(d => d.weight != null).length;
  const confidence = confidenceFor(logged, weighs);
  const observed = observedTdee(days, trend);
  const totalValid = days.filter(isLogged).length;
  let tdee = prev, reason = "lowConfidence", adjusted = false;
  if (confidence !== "low" && trendNow != null) {
    const blended = observed == null ? formula : (1 - obsWeight(totalValid)) * formula + obsWeight(totalValid) * observed.tdee;
    tdee = clamp(blended, prev - C.maxWeeklyChange, prev + C.maxWeeklyChange);
    adjusted = true;
    const losing = g.type === "lose" || g.type === "recomp";
    const n = trend.length;
    const flat = n - 1 >= C.plateauDays && trend[n - 1 - C.plateauDays] != null && Math.abs(trendNow - trend[n - 1 - C.plateauDays]) < C.plateauMax;
    if (losing && flat && confidence === "high" && tdee < prev - 25) reason = "plateau";
    else if (tdee > prev + 25) reason = "tdeeUp";
    else if (tdee < prev - 25) reason = "tdeeDown";
    else reason = "onTrack";
  }
  const t = targetKcal(tdee, g.type, g.pace, kg, p.sex);
  return { avgIntake: observed?.avgIntake ?? null, trendChange: observed?.trendChange ?? null, formula, observed, prev, tdee,
    proposal: macrosFor(t.kcal, kg, g.type, bf), confidence, reason, floorHit: t.floorHit, adjusted, trendNow, logged, weighs };
}

// ============================================================================
// Offline text meal estimator (same table as lib/data/food_estimator.dart)
// ============================================================================
const FOODS = [
  [["현미밥","brown rice"],210,300,6.5,63,2.3],[["잡곡밥"],210,305,7,64,1.8],[["흰쌀밥","쌀밥","공기밥","밥","rice"],210,310,5.5,68,.6],

function estimateText(input) {
  const chunks = input.split(/[,+\n\/]|\band\b|그리고|랑|하고/).map(s => s.trim()).filter(Boolean);
  return chunks.map(chunk => {
    const lower = chunk.toLowerCase();
    let m = null, len = 0;
    for (const f of FOODS) for (const n of f[0]) if (lower.includes(n) && n.length > len) { m = f; len = n.length; }
    if (!m) return { name: chunk, kcal: 0, p: 0, c: 0, f: 0, matched: false };
    let sv;
    const g = lower.match(/(\d+(?:\.\d+)?)\s*(g|그램|ml)/);
    if (g) sv = parseFloat(g[1]) / m[1];
    else {
      const c = lower.match(/(\d+(?:\.\d+)?)/);
      if (c) sv = parseFloat(c[1]);
      else if (lower.includes("반")) sv = 0.5;
      else { const w = { "두": 2, "세": 3, "네": 4 }; sv = 1; for (const k in w) if (new RegExp(k + "\\s*(개|공기|인분|조각|줄|잔|장|컵|스쿱|알)").test(lower)) sv = w[k]; }
    }
    return { name: chunk, kcal: m[2] * sv, p: m[3] * sv, c: m[4] * sv, f: m[5] * sv, matched: true };
  });
}

const dayOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const dk = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const pd = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const fmtDate = d => `${d.getMonth() + 1}월 ${d.getDate()}일 (${WD[d.getDay()]})`;
const fmtMd = d => `${d.getMonth() + 1}. ${d.getDate()}.`;
const f0 = v => Math.round(v).toLocaleString("ko-KR");
const f1 = v => (Math.round(v * 10) / 10).toFixed(1);
const s1 = v => (v > 0 ? "+" : "") + f1(v);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const today = () => dayOnly(new Date());

const KEY = "adapt.preview.v1";
const empty = () => ({ profile: null, settings: { checkinWeekday: 1, notifications: true, consentedAt: null }, weights: [], meals: [], saved: [], plans: [] });
let S = (() => { try { const r = localStorage.getItem(KEY); return r ? JSON.parse(r) : empty(); } catch (e) { return empty(); } })();
function save() { sortAll(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function sortAll() { S.weights.sort((a, b) => a.date.localeCompare(b.date)); S.meals.sort((a, b) => a.time - b.time); S.plans.sort((a, b) => a.weekStart.localeCompare(b.weekStart)); }
sortAll();

const goalOf = p => ({ type: p.goalType, pace: p.pace, sessions: p.strength + p.cardio, targetKg: p.targetKg });
const currentPlan = () => S.plans[S.plans.length - 1] || null;
function planOn(d) { const k = dk(d); let f = null; for (const p of S.plans) if (p.weekStart <= k) f = p; return f || S.plans[0] || null; }
const weightOn = d => S.weights.find(w => w.date === dk(d)) || null;
const mealsOn = d => S.meals.filter(m => m.date === dk(d));
const totalsOn = d => mealsOn(d).reduce((a, m) => ({ kcal: a.kcal + m.kcal, p: a.p + m.p, c: a.c + m.c, f: a.f + m.f }), { kcal: 0, p: 0, c: 0, f: 0 });
const latestBf = () => { for (let i = S.weights.length - 1; i >= 0; i--) if (S.weights[i].bf != null) return S.weights[i].bf; return null; };
function dayLogs() {
  let first = null;
  if (S.weights.length) first = pd(S.weights[0].date);
  if (S.meals.length) { const m = pd(S.meals[0].date); if (!first || m < first) first = m; }
  if (!first) return [];
  const wBy = {}, iBy = {};
  S.weights.forEach(w => wBy[w.date] = w.kg);
  S.meals.forEach(m => iBy[m.date] = (iBy[m.date] || 0) + m.kcal);
  const out = [], t = today();
  for (let d = first; d <= t; d = addDays(d, 1)) out.push({ date: d, weight: wBy[dk(d)] ?? null, intake: iBy[dk(d)] ?? null });
  return out;
}
function trendPoints() { const l = dayLogs(), t = trendSeries(l.map(d => d.weight)); return l.map((d, i) => ({ date: d.date, raw: d.weight, trend: t[i] })); }
const trendWeight = () => { const p = trendPoints(); return p.length ? p[p.length - 1].trend : null; };
function weeklyChange() { const p = trendPoints(); if (p.length < 8 || p[p.length - 1].trend == null || p[p.length - 8].trend == null) return null; return p[p.length - 1].trend - p[p.length - 8].trend; }
function eta() {
  const p = S.profile; if (!p || p.targetKg == null) return null;
  const kg = trendWeight() ?? (S.weights.length ? S.weights[S.weights.length - 1].kg : 70);
  return etaWeeks(trendPoints().map(x => x.trend), p.targetKg, plannedKgPerWeek(p.goalType, p.pace, kg));
}
function etaText(e) {
  if (!e) return "아직 예측하기 어려워요";
  if (e[1] <= 0.5) return "거의 도착했어요!";
  const mn = Math.max(1, Math.floor(e[0])), mx = Math.max(mn + 1, Math.ceil(e[1]));
  return `약 ${mn}~${mx}주 후`;
}
function nextCheckin() {
  const p = currentPlan(); if (!p) return null;
  let d = addDays(pd(p.weekStart), 4);
  while ((d.getDay() || 7) !== S.settings.checkinWeekday) d = addDays(d, 1);
  return d;
}
const checkinDue = () => { const n = nextCheckin(); return !!n && today() >= n; };
function runCheckin() {
  const p = S.profile, plan = currentPlan(); if (!p || !plan) return null;
  const t = today();
  const logs = dayLogs().map(d => +d.date === +t ? { ...d, intake: null } : d);
  if (!logs.length) return null;
  return weeklyCheckin(p, goalOf(p), logs, t, plan.tdee, latestBf());
}
function weekLog() {
  const md = new Set(S.meals.map(m => m.date)), wd = new Set(S.weights.map(w => w.date));
  return Array.from({ length: 7 }, (_, i) => { const d = addDays(today(), i - 6); return { d, meal: md.has(dk(d)), weight: wd.has(dk(d)) }; });
}
function streak() {
  const days = new Set([...S.meals.map(m => m.date), ...S.weights.map(w => w.date)]);
  let d = today(); if (!days.has(dk(d))) d = addDays(d, -1);
  let n = 0; while (days.has(dk(d))) { n++; d = addDays(d, -1); }
  return n;
}
function recentMeals() {
  const since = dk(addDays(today(), -14)), saved = new Set(S.saved.map(s => s.name)), seen = new Set(), out = [];
  for (let i = S.meals.length - 1; i >= 0 && out.length < 6; i--) {
    const m = S.meals[i]; if (m.date < since) break;
    if (saved.has(m.name) || seen.has(m.name)) continue; seen.add(m.name); out.push(m);
  }
  return out;
}
function muscleWarn() {
  const p = S.profile; if (!p || p.goalType === "maintain" || p.goalType === "gain") return false;
  return muscleLossWarning(S.weights.filter(w => w.smm != null).map(w => [pd(w.date), w.smm]));
}

// mutations
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function upsertWeight(e) { S.weights = S.weights.filter(w => w.date !== e.date); S.weights.push(e); save(); }
function addMeal(m, date) {
  const d = date || today(), n = new Date();
  S.meals.push({ id: uid(), date: dk(d), time: +new Date(d.getFullYear(), d.getMonth(), d.getDate(), n.getHours(), n.getMinutes()), edited: false, ...m });
  save();
}
function addPlan(pl) { S.plans = S.plans.filter(p => p.weekStart !== pl.weekStart); S.plans.push(pl); save(); }
function applyCheckin(r, status, manual) {
  const plan = currentPlan(), p = S.profile;
  let m;
  if (status === "accepted") m = r.proposal;
  else if (status === "manual") m = macrosFor(Math.max(manual, C.floor[p.sex]), r.trendNow ?? S.weights[S.weights.length - 1].kg, p.goalType, latestBf());
  else m = { kcal: plan.kcal, p: plan.p, c: plan.c, f: plan.f };
  addPlan({ weekStart: dk(today()), kcal: m.kcal, p: m.p, c: m.c, f: m.f, tdee: r.tdee, confidence: r.confidence, reason: r.reason, status });
}

function loadDemo() {
  let seed = 7;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const gauss = sd => sd * Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd());
  const weeks = 5, t = today(), start = addDays(t, -weeks * 7);
  const profile = S.profile || { sex: "male", birthYear: t.getFullYear() - 32, heightCm: 176, goalType: "lose", pace: "normal", strength: 3, cardio: 1, targetKg: 74, targetBf: null };
  const g = goalOf(profile), startKg = 80, bf = 22;
  const init = initialPlan(profile, g, startKg, start, bf);
  const trueTdee = init.tdee + 180;
  const weights = [], meals = [], plans = [{ weekStart: dk(start), kcal: init.macros.kcal, p: init.macros.p, c: init.macros.c, f: init.macros.f, tdee: init.tdee, status: "initial" }];
  const names = [["그릭요거트 + 바나나", "오트밀 + 우유", "계란 2개 + 식빵"], ["닭가슴살 샐러드", "현미밥 + 제육볶음", "비빔밥", "김밥 1줄"], ["연어 스테이크 + 고구마", "두부 된장찌개 + 밥", "소고기 + 현미밥", "닭가슴살 + 고구마"]];
  let mass = startKg, target = init.macros.kcal, prev = init.tdee;
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i), eaten = target + gauss(140);
    mass += (eaten - (trueTdee + 22 * (mass - startKg))) / C.kcalPerKg;
    if (rnd() < .88) { const comp = i % 7 === 0; weights.push({ date: dk(d), kg: +(mass + gauss(.45)).toFixed(1), bf: comp ? +(bf - i * .06).toFixed(1) : null, smm: comp ? +(35.2 - i * .004).toFixed(1) : null }); }
    if (rnd() < .93) [.25, .4, .35].forEach((sp, j) => {
      const k = Math.round(eaten * sp);
      meals.push({ id: `demo-${i}-${j}`, date: dk(d), time: +new Date(d.getFullYear(), d.getMonth(), d.getDate(), [8, 13, 19][j], Math.floor(rnd() * 50)),
        name: names[j][Math.floor(rnd() * names[j].length)], kcal: k, p: Math.round(k * .3 / 4), c: Math.round(k * .42 / 4), f: Math.round(k * .28 / 9), source: "manual", edited: false });
    });
    if ((i + 1) % 7 === 0 && i + 1 < weeks * 7) {
      const wBy = {}, iBy = {}; weights.forEach(w => wBy[w.date] = w.kg); meals.forEach(m => iBy[m.date] = (iBy[m.date] || 0) + m.kcal);
      const logs = []; for (let j = 0; j <= i; j++) { const dd = addDays(start, j); logs.push({ date: dd, weight: wBy[dk(dd)] ?? null, intake: iBy[dk(dd)] ?? null }); }
      const r = weeklyCheckin(profile, g, logs, d, prev, bf);
      plans.push({ weekStart: dk(addDays(d, 1)), kcal: r.proposal.kcal, p: r.proposal.p, c: r.proposal.c, f: r.proposal.f, tdee: r.tdee, confidence: r.confidence, reason: r.reason, status: r.adjusted ? "accepted" : "kept" });
      if (r.adjusted) { prev = r.tdee; target = r.proposal.kcal; }
    }
  }
  weights.push({ date: dk(t), kg: +(mass + gauss(.45)).toFixed(1), bf: null, smm: null });
  const saved = [["그릭요거트 + 바나나", 290, 17, 40, 6], ["닭가슴살 샐러드", 380, 38, 22, 14], ["현미밥 + 제육볶음", 750, 32, 78, 34]];
  saved.slice(0, 2).forEach((s, j) => meals.push({ id: `demo-today-${j}`, date: dk(t), time: +new Date(t.getFullYear(), t.getMonth(), t.getDate(), [8, 12][j], 20), name: s[0], kcal: s[1], p: s[2], c: s[3], f: s[4], source: "saved", edited: false }));
  S = { profile, settings: { ...S.settings, checkinWeekday: t.getDay() || 7, consentedAt: S.settings.consentedAt || Date.now() }, weights, meals,
    saved: saved.map((s, j) => ({ id: "ds" + j, name: s[0], kcal: s[1], p: s[2], c: s[3], f: s[4] })), plans };
  save();
}

function chartSvg(pts, goal) {
  const W = 340, H = 240, L = 34, B = 22, T = 8, R = 8;
  const vals = pts.flatMap(p => [p.raw, p.trend]).filter(v => v != null);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const showGoal = goal != null && goal > lo - 8 && goal < hi + 8;
  if (showGoal) { lo = Math.min(lo, goal); hi = Math.max(hi, goal); }
  lo = Math.floor(lo - .5); hi = Math.ceil(hi + .5); if (hi - lo < 2) hi = lo + 2;
  const cw = W - L - R, ch = H - B - T, n = pts.length;
  const x = i => L + cw * i / (n - 1), y = v => T + ch - ch * (v - lo) / (hi - lo);
  const stepv = Math.max(1, Math.ceil((hi - lo) / 4));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="체중 추세 그래프">`;
  for (let v = lo; v <= hi + .001; v += stepv) s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  [0, Math.floor((n - 1) / 2), n - 1].forEach((i, k) => s += `<text x="${x(i)}" y="${H - 4}" text-anchor="${["start", "middle", "end"][k]}">${fmtMd(pts[i].date)}</text>`);
  if (showGoal) s += `<line x1="${L}" x2="${W - R}" y1="${y(goal)}" y2="${y(goal)}" stroke="var(--mint)" stroke-width="2" stroke-dasharray="5 5"/>`;
  pts.forEach((p, i) => { if (p.raw != null) s += `<circle class="pt" style="animation-delay:${Math.round(i / n * 500)}ms" cx="${x(i)}" cy="${y(p.raw)}" r="${n > 60 ? 2.4 : 3.4}" fill="var(--sky)" fill-opacity=".45"/>`; });
  const tp = pts.map((p, i) => p.trend == null ? null : [x(i), y(p.trend)]).filter(Boolean);
  if (tp.length > 1) {
    const d = "M" + tp.map(p => p.map(v => v.toFixed(1)).join(",")).join("L");
    s += `<defs><linearGradient id="fillg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#FF8E7F" stop-opacity=".2"/><stop offset="1" stop-color="#FF8E7F" stop-opacity="0"/></linearGradient></defs>
      <path d="${d}L${tp[tp.length - 1][0]},${T + ch}L${tp[0][0]},${T + ch}Z" fill="url(#fillg)"/>
      <path class="trend" d="${d}" stroke="var(--peach)" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="${tp[tp.length - 1][0]}" cy="${tp[tp.length - 1][1]}" r="6" fill="#fff" class="pt" style="animation-delay:1s"/><circle cx="${tp[tp.length - 1][0]}" cy="${tp[tp.length - 1][1]}" r="4.5" fill="var(--peach)" class="pt" style="animation-delay:1s"/>`;
  }
  return s + "</svg>";
}

        <p style="line-height:1.65;margin:12px 0 0;font-size:14px">${r.observed ? `최근 ${r.observed.windowDays}일 동안 평균 ${f0(r.observed.avgIntake)} kcal를 먹었고 추세 체중이 ${s1(r.observed.trendChange)}kg 변했어요. 1kg ≈ 7,700 kcal로 환산하면 실제 소비량은 약 ${f0(r.observed.tdee)} kcal예요. 이를 공식 추정치(${f0(r.formula)} kcal)와 섞고, 한 주 변화폭을 ±150 kcal로 제한해서 ${f0(r.tdee)} kcal로 정했어요.`
          : `아직 실측 데이터가 부족해서 공식 추정치(${f0(r.formula)} kcal)를 기준으로 해요. 2주 정도 꾸준히 기록하면 실제 소비량을 계산할 수 있어요.`}</p></details>`;
  }
  html += `<h2 class="h sect" style="margin-bottom:0">목표 변화 기록</h2><div ${st()}><div class="card list" style="padding:4px 0">${S.plans.slice().reverse().slice(0, 12).map(p => `<div class="row" style="padding:10px 20px">

  return html;
}

        ${ic(icon, 22, color)}<span style="flex:1;min-width:0"><b class="h ellipsis" style="display:block">${esc(m.name)}</b><span class="muted" style="font-size:12px">P ${f0(m.p)} · C ${f0(m.c)} · F ${f0(m.f)}</span></span>
        <b class="h num">${f0(m.kcal)} kcal</b>${del ? `<button class="iconbtn" data-act="delSaved" data-id="${m.id}" aria-label="삭제">${ic("x", 16, "var(--soft)")}</button>` : ""}</div>`;

        + (rec.length ? `<h3 class="h sect">최근 먹은 것</h3>` + rec.map((m, i) => `<div class="stg" style="animation-delay:${(i + S.saved.length) * 50}ms">${item(m, "history", "var(--sky)", false)}</div>`).join("") : "");

  } else if (sheet.kind === "weight") {

    if (sheet.kg == null) { sheet.kg = cur?.kg ?? S.weights[S.weights.length - 1]?.kg ?? 70; sheet.bf = cur?.bf ?? ""; sheet.smm = cur?.smm ?? ""; sheet.comp = cur?.bf != null || cur?.smm != null; }

      ${sheet.comp ? `<div class="row" style="margin-top:14px">${[["wBf", "체지방률 (%)", sheet.bf], ["wSmm", "골격근량 (kg)", sheet.smm]].map(([id, l, v]) => `<div class="field"><label for="${id}">${l}</label><input class="input num" id="${id}" inputmode="decimal" value="${v ?? ""}"></div>`).join("")}</div>
        <p class="note" style="margin:8px 4px 0">체성분은 같은 기기, 같은 조건(주 1회, 아침 공복)에서 재면 가장 정확해요.</p>`
        : `<button class="btn txt" data-act="showComp" style="margin-top:8px">+ 체성분도 입력하기</button>`}
      <div class="row" style="background:var(--sky-soft);border-radius:16px;padding:12px 14px;margin:14px 0 18px">${ic("scale", 20, "var(--sky)")}<b class="h" style="flex:1">건강앱 자동 연동</b><span class="muted" style="font-size:12px">모바일 앱에서 지원 예정</span></div>
      <button class="btn pri" data-act="weightSave">저장</button>`;
  } else if (sheet.kind === "manageSaved") {
    b.innerHTML = `<h2 class="h" style="font-size:22px;margin:0 0 12px">내 식사 관리</h2>` + (S.saved.length ? `<div class="card list" style="padding:4px 0">${S.saved.map(m => `<div class="row" style="padding:8px 8px 8px 18px">

let lastView = "";
function render() {
  const app = $("#app");
  const viewKey = ui.ob ? "ob" + ui.ob.step : ui.tab + (ui.date ? dk(ui.date) : "");
  animate = viewKey !== lastView;
  lastView = viewKey;
  if (ui.ob || !S.profile || !S.plans.length) {
    if (!ui.ob) ui.ob = newOb(false);
    app.innerHTML = viewOnboarding();
  } else {
    const v = { today: viewToday, trend: viewTrend, checkin: viewCheckin, settings: viewSettings }[ui.tab]();
    const due = checkinDue();
    const nav = [["today", "sun", "오늘"], ["trend", "chart", "트렌드"], ["checkin", "cal", "체크인"], ["settings", "tune", "설정"]];
    app.innerHTML = `<div class="page ${animate ? "view" : ""}" id="view">${v}</div><nav class="nav" aria-label="메뉴"><div class="in">${nav.map(([k, icn, l]) => `<button class="${ui.tab === k ? "on" : ""}" data-act="tab" data-v="${k}" ${ui.tab === k ? 'aria-current="page"' : ""}>
      <span class="pil">${ic(icn)}</span>${l}${k === "checkin" && due ? '<span class="dot"></span>' : ""}</button>`).join("")}</div></nav>`;
  }
  ui.dir = "";
  afterRender();
}
const val = id => $("#" + id)?.value ?? "";
const readMeal = () => ({ name: val("mName").trim(), kcal: num(val("mKcal")) || 0, p: num(val("mP")) || 0, c: num(val("mC")) || 0, f: num(val("mF")) || 0 });

const actions = {
  consent: el => { ui.ob.consent = el.checked; $("#obNext").disabled = !obCanNext(ui.ob); $("#obDemo").disabled = !ui.ob.consent; },
  obNext: () => {
    const o = ui.ob, steps = obSteps(o);
    if (steps[o.step] === "result") { const edit = o.editing; obFinish(); if (edit) ui.tab = "settings"; }
    else { o.step++; ui.dir = "fwd"; }
    render(); scrollTo(0, 0);
  },
  obBack: () => { const o = ui.ob; if (o.step === 0) { if (o.editing) { ui.ob = null; ui.tab = "settings"; } } else { o.step--; ui.dir = "back"; } render(); },
  obGoal: el => { ui.ob.goal = el.dataset.v; render(); },
  obSex: el => { ui.ob.sex = el.dataset.v; render(); },
  obByBf: el => { ui.ob.byBf = el.dataset.v === "1"; render(); },
  obPace: el => { ui.ob.pace = el.dataset.v; render(); },
  obStep: el => { const k = el.dataset.k; ui.ob[k] = clamp(ui.ob[k] + +el.dataset.d, 0, 14); render(); },
  demo: () => { loadDemo(); ui.ob = null; ui.tab = "today"; ui.date = null; render(); toast("샘플 데이터를 채웠어요. 체크인 탭을 확인해 보세요!"); },
  tab: el => { if (ui.tab === el.dataset.v) return; ui.tab = el.dataset.v; ui.forcePreview = false; render(); scrollTo(0, 0); },
  goCheckin: () => { ui.tab = "checkin"; render(); scrollTo(0, 0); },
  dayPrev: () => { ui.date = addDays(ui.date || today(), -1); ui.dir = "back"; render(); },
  dayNext: () => { const n = addDays(ui.date, 1); ui.date = +n >= +today() ? null : n; ui.dir = "fwd"; render(); },
  dayToday: () => { ui.date = null; ui.dir = "fwd"; render(); },
  addMeal: () => openSheet("meal", { tab: S.saved.length || recentMeals().length ? "saved" : "text", text: "" }),
  mealTab: el => { sheet.tab = el.dataset.v; renderSheet(); },
  estimate: () => { sheet.text = val("mText"); if (!sheet.text.trim()) return; sheet.est = estimateText(sheet.text); renderSheet(); },
  mealAdd: () => {
    const m = readMeal(); if (!m.name || m.kcal <= 0) { toast("이름과 칼로리를 입력해 주세요"); return; }
    addMeal({ ...m, source: sheet.tab === "text" ? "text" : "manual" }, ui.date);
    if ($("#mSave")?.checked) { S.saved = S.saved.filter(s => s.name !== m.name); S.saved.push({ id: uid(), ...m }); save(); }
    closeSheet(); render(); toast(`${m.name} 추가!`);
  },
  quickAdd: el => { const d = el.dataset; addMeal({ name: d.name, kcal: +d.k, p: +d.p, c: +d.c, f: +d.f, source: "saved" }, ui.date); closeSheet(); render(); toast(`${d.name} 추가!`); },
  delSaved: (el, ev) => { ev.stopPropagation(); S.saved = S.saved.filter(s => s.id !== el.dataset.id); save(); renderSheet(); if (ui.tab === "settings") render(); },
  editMeal: el => openSheet("edit", { meal: { ...S.meals.find(m => m.id === el.dataset.id) } }),
  mealSave: () => { const m = readMeal(); if (!m.name || m.kcal <= 0) { toast("이름과 칼로리를 입력해 주세요"); return; }
    const i = S.meals.findIndex(x => x.id === sheet.meal.id); S.meals[i] = { ...S.meals[i], ...m, edited: true }; save(); closeSheet(); render(); toast("수정했어요"); },
  mealDelete: () => { S.meals = S.meals.filter(x => x.id !== sheet.meal.id); save(); closeSheet(); render(); toast("삭제했어요"); },
  weight: () => openSheet("weight", {}),
  bump: el => { sheet.kg = clamp(Math.round((sheet.kg + +el.dataset.v) * 10) / 10, 25, 300); const k = $("#kgv"); k.textContent = f1(sheet.kg); k.animate([{ transform: "scale(1.08)" }, { transform: "scale(1)" }], { duration: 300, easing: "cubic-bezier(.34,1.56,.64,1)" }); },
  showComp: () => { sheet.comp = true; renderSheet(); },
  weightSave: () => {
    const bf = num(val("wBf")), smm = num(val("wSmm"));
    upsertWeight({ date: dk(ui.date || today()), kg: sheet.kg, bf: bf > 2 && bf < 70 ? bf : null, smm: smm > 5 && smm < 100 ? smm : null });
    closeSheet(); render(); toast("체중을 기록했어요");
  },
  delWeight: el => { S.weights = S.weights.filter(w => w.date !== el.dataset.v); save(); render(); },
  range: el => { ui.trendRange = +el.dataset.v; render(); },
  forcePreview: () => { ui.forcePreview = true; render(); },
  ciAccept: () => { applyCheckin(runCheckin(), "accepted"); ui.forcePreview = false; render(); toast("새 목표를 적용했어요!"); },
  ciKeep: () => { applyCheckin(runCheckin(), "kept"); ui.forcePreview = false; render(); toast("기존 목표를 유지해요"); },
  ciManual: () => {
    const floor = C.floor[S.profile.sex], r = runCheckin();
    dialog(`<h3 class="h" style="margin:0 0 14px;font-size:20px">목표 칼로리 직접 입력</h3><input class="input num" id="manKcal" inputmode="numeric" value="${Math.round(r.proposal.kcal)}">
      <p class="note" id="manNote" style="margin:8px 4px 16px">최소 ${f0(floor)} kcal 이상이어야 해요</p>
      <div class="row" style="justify-content:flex-end;gap:4px"><button class="btn txt" data-act="closeDialog" style="color:var(--soft)">취소</button><button class="btn txt" data-act="manOk">확인</button></div>`);
    setTimeout(() => $("#manKcal")?.focus(), 50);
  },
  manOk: () => { const v = num(val("manKcal")), floor = C.floor[S.profile.sex];
    if (v == null || v < floor || v >= 8000) { const n = $("#manNote"); n.style.color = "var(--over)"; n.animate([{ transform: "translateX(-6px)" }, { transform: "translateX(6px)" }, { transform: "none" }], { duration: 250 }); return; }
    closeDialog(); applyCheckin(runCheckin(), "manual", v); ui.forcePreview = false; render(); toast("직접 정한 목표를 적용했어요"); },
  closeDialog: () => closeDialog(),
  closeSheet: () => closeSheet(),
  editGoal: () => { ui.ob = newOb(true); ui.dir = "fwd"; render(); scrollTo(0, 0); },
  manageSaved: () => openSheet("manageSaved"),
  notif: () => { S.settings.notifications = !S.settings.notifications; save(); $("[data-act=notif]").classList.toggle("on", S.settings.notifications); },
  demoConfirm: () => confirmDialog("지금 기록이 샘플 데이터로 바뀌어요. 계속할까요?", "확인", "demoYes"),
  demoYes: () => { closeDialog(); actions.demo(); },
  deleteConfirm: () => confirmDialog("체중, 식사, 목표 기록이 모두 지워지고 처음 화면으로 돌아가요. 되돌릴 수 없어요.", "삭제", "deleteYes", true),
  deleteYes: () => { closeDialog(); S = empty(); save(); ui.ob = null; ui.tab = "today"; ui.date = null; render(); },
};
document.addEventListener("click", ev => {
  const el = ev.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = actions[el.dataset.act]; if (!a || el.tagName === "SELECT") return;
  if (el.type === "checkbox") return;
  a(el, ev);
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if (el.dataset.act === "consent") actions.consent(el);
  if (el.dataset.act === "weekday") { S.settings.checkinWeekday = +el.value; save(); }
});
document.addEventListener("input", ev => {
  const el = ev.target;
  if (el.dataset.ob && ui.ob) {
    ui.ob[el.dataset.ob] = el.value;
    $("#obNext").disabled = !obCanNext(ui.ob);
    if (el.dataset.ob === "targetBf") { const tw = obTarget(ui.ob), r = $("#bfResult");
      r.innerHTML = tw != null ? `<div class="card h" style="background:var(--lilac-soft);box-shadow:none;padding:16px">근육(제지방량)을 유지하면 목표 체중은 약 ${f1(tw)}kg이에요</div>` : ""; }
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape") { closeDialog(); closeSheet(); }
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches("[role=button]")) { ev.preventDefault(); ev.target.click(); }
});
render();
</script>
</body>
</html>
